syntax = "proto3";

package wood_proto;

import "polyline.proto";
import "line.proto";

// The state of an InteractionContactFace beyond the kernel Interaction: two coplanar faces in contact and the region they share.
message InteractionContactFace {
  repeated laika_proto.Line lines = 5;
  repeated laika_proto.Polyline volumes = 6;
  reserved 7, 8;
  reserved "joint_type", "male_is_b";
  int32 face_a = 1;                    // Face index on the edge's first element
  int32 face_b = 2;                    // Face index on the edge's second element
  int32 type = 3;                      // ContactType: -1 unknown, 0 side_side, 1 side_top, 2 top_top
  laika_proto.Polyline polygon = 4;  // Boolean intersection of the two face outlines, closed, in face_a's plane
}
