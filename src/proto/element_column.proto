syntax = "proto3";

package wood_proto;
import "interaction_feature_solid.proto";
import "interaction_feature_plane.proto";

import "line.proto";
import "plane.proto";
import "polyline.proto";

// The state of a Column beyond the kernel Element: its axis, section, cuts and solid features.
message Column {
  repeated InteractionFeatureSolid solid_features = 6;
  repeated InteractionFeaturePlane plane_features = 10;  // The planes other elements cut it by
  session_proto.Line axis = 1;           // Centreline, base to head
  session_proto.Polyline section = 2;    // Closed cross-section about the axis base
  repeated session_proto.Plane cuts = 3; // Planes the solid is cut by, each keeping the side its normal points to
  repeated session_proto.Polyline profile = 4; // Section loops in the profile frame the section was placed from; empty when the section was given
  double rotation = 5;                   // Degrees the profile x axis turns from world x about the axis
  reserved 7, 8, 9;
  reserved "head", "head_height";
}
