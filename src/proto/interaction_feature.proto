syntax = "proto3";

package wood_proto;

import "interaction_feature_plate.proto";
import "interaction_feature_beam.proto";
import "interaction_feature_plate_beam.proto";

// What the solver cut at one contact, exactly one kind.
message InteractionFeature {
  string guid = 1;                                              // Unique identifier
  int32 contact = 2;                                            // Index into Interaction.contacts
  reserved 3, 4;
  oneof data {
    FeaturePlate plate = 10;
    FeatureBeam beam = 11;
    FeaturePlateBeam plate_beam = 12;
  }
}
