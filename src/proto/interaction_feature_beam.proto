syntax = "proto3";

package wood_proto;

import "polyline.proto";
import "vector.proto";

// The state of an InteractionFeatureBeam beyond the kernel Interaction: the four volume rectangles cut where two axes meet.
message InteractionFeatureBeam {
  int32 end_type = 1;                           // 0 crossing, 1 side to end, 2 end to end
  repeated session_proto.Polyline volumes = 2;  // 4 rectangles: 2 on the first beam, 2 on the second
  reserved 3;
  reserved "contact_guid";
  session_proto.Vector normal = 4;              // The normal of the two axes where they meet
  repeated session_proto.Vector axes = 5;       // Each beam's axis direction there, the first beam's then the second's
}
