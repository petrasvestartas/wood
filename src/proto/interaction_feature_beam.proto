syntax = "proto3";

package wood_proto;

import "polyline.proto";

// A beam-to-beam joint: the four volume rectangles cut where two axes meet.
message FeatureBeam {
  int32 end_type = 1;                           // 0 crossing, 1 side to end, 2 end to end
  repeated session_proto.Polyline volumes = 2;  // 4 rectangles: 2 on the first beam, 2 on the second
}
