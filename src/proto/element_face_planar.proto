syntax = "proto3";

package wood_proto;
import "interaction_feature_solid.proto";

import "polyline.proto";

// The state of a FacePlanarElement beyond the kernel Element: its two outlines.
message FacePlanarElement {
  repeated InteractionFeatureSolid solid_features = 4;
  laika_proto.Polyline bottom = 1;  // Bottom outline
  laika_proto.Polyline top = 2;     // Top outline
  bool reversed = 3;                  // True when the constructor reversed both outlines
}
