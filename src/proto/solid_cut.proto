syntax = "proto3";
package wood_proto;
import "mesh.proto";
import "polyline.proto";
import "vector.proto";
import "line.proto";
// One cut a joint makes into an element, in the element's frame.
message SolidCut {
  string joint_guid = 1;                     // The joint that made it, so a later joint replaces its own cut
  session_proto.Mesh mesh = 2;               // The closed cutter solid; empty for a cut of drills alone
  repeated session_proto.Polyline profile = 3; // A profile cut's closed loops, extruded along extrusion
  session_proto.Vector extrusion = 4;        // The profile's extrusion
  int32 operation = 5;                       // SolidOperation: 0 intersection, 1 unite, 2 difference
  double tolerance = 6;                      // Boolean tolerance
  repeated session_proto.Line drills = 7;    // Round holes kept as axes, exact in the BRep
  double drill_radius = 8;                   // Radius of the drills
  double drill_tolerance = 9;                // Chord tolerance the drills are meshed at
}
