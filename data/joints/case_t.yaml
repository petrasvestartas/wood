sliding_dovetail_case:
  title: "Sliding dovetail joint"
  german: "Gratnutverbindung"
  page: "854"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "depth = 0.4"
    - "neck = 0.45"
    - "flare = 0.75"
  points:
    - "U = O + n"
    - "E = O - 2*depth*bh*n"
    - "N1 = O + neck*ah*p"
    - "F1 = E + flare*ah*p"
    - "N2 = O - neck*ah*p"
    - "F2 = E - flare*ah*p"
  planes:
    - "bottom = O - 2*bh*n, n, O"
    - "shoulder = O, n, U"
    - "side_1 = O + ah*p, p, O"
    - "side_2 = O - ah*p, p, O"
    - "end = E, n, O"
    - "flank_1 = N1, cross(w, F1 - N1), O"
    - "flank_2 = N2, cross(w, F2 - N2), O"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder flank_1; a_end shoulder flank_2"
    - "B2 b_node -end -flank_1 -flank_2"
  insertions:
    - "w"

