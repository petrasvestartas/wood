  family: "splicing"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "lap = 0.75"
  points:
    - "A = O - L*u"
    - "U1 = O + L*u + ah*p"
    - "U2 = O + L*u - ah*p"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "v_up = A, cross(w, U1 - A), O + L*u"
    - "v_dn = A, cross(w, U2 - A), O + L*u"
  parts:
  steps:
    - "A2 a_end v_up; a_end v_dn"
    - "B2 b_end -v_up -v_dn"
  insertions:
    - "-u"

