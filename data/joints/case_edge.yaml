foxtail_wedged_floating_tenon_edge:
  title: "Foxtail-wedged floating tenon joint"
  german: "Stoß mit verkeiltem eingesetztem Zapfen"
  page: "778"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  sealed: "true"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "lap = 0.1"
    - "tenon = 0.33"
    - "reach = 2.5"
    - "width = 0.25"
    - "fox = 0.02"
  points:
    - "C = O + L*u"
    - "S = C - tenon*ah*p"
    - "H1 = S + reach*ah*u + (width + 2*fox)*aw*w"
    - "H2 = S + width*aw*w"
    - "H3 = S - reach*ah*u + (width + 2*fox)*aw*w"
    - "H4 = S - reach*ah*u - (width + 2*fox)*aw*w"
    - "H5 = S - width*aw*w"
    - "H6 = S + reach*ah*u - (width + 2*fox)*aw*w"
