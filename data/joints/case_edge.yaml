    - "wedge_b2 = C - (reach*ah - 0.5)*u - width*aw/3*w, C - 0.5*reach*ah*u - width*aw/3*w, p, tenon*ah, fox*aw, 0.01*aw, none"
  steps:
    - "A2 a_end shoulder_a"
    - "A3 tenon"
    - "P1 wedge_a1; wedge_a2; wedge_b1; wedge_b2"
    - "B2 tenon"
  insertions:
    - "-u"
