    - "shoulder_a = O + L*u, u, O + 2*L*u"
  parts:
    - "tenon = H1 H2 H3 H4 H5 H6, 2*tenon*ah*p, none"
    - "wedge_a1 = C + (reach*ah - 0.5)*u + width*aw/3*w, C + 0.5*reach*ah*u + width*aw/3*w, p, tenon*ah, fox*aw, 0.01*aw, none"
