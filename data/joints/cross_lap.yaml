    - "under = R - ah*p, p, R"
    - "inner = O - bt*t, t, O - 2*bt*t"
    - "side_1 = O + aw*w, w, O"
    - "side_2 = O - aw*w, w, O"
    - "diagonal = D1, cross(n, D2 - D1), O + 2*bt*t"
  parts:
  steps:
    - "A2 a_node top -diagonal inner -outer"
    - "B2 b_node -under diagonal -side_1 -side_2"
