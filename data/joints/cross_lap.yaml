    - "sit = 1"
    - "peg = 0.12"
  points:
  planes:
    - "mid = O - bh*n, n, O"
    - "inner = O - bt*t, t, O - 2*bt*t"
    - "outer = O + bt*t, t, O"
  parts:
    - "peg = O, O - 2*bh*n, w, peg*ah"
  steps:
    - "A2 a_node mid inner -outer"
    - "A3 peg"
    - "B2 b_node -mid"
    - "B3 peg"
  insertions:
    - "-n"

