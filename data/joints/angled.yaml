    - "D = meet(E, unit(-t - u), O - 2*front_depth*bh*n, n)"
    - "H = meet(F, -u, O - 2*heel_depth*bh*n, n)"
    - "G = meet(H, p, O, n)"
  planes:
    - "front = E, cross(D - E, w), F"
    - "seat = D, cross(G - D, w), E"
    - "heel = H, u, H + u"
    - "under = F, p, F + p"
  parts:
  steps:
    - "A2 a_end front"
    - "A3 a_end seat heel"
    - "A4 a heel"
    - "B2 b -front"
    - "B3 b_node -front -seat"
    - "B4 b -heel"
    - "B5 b_node -heel -under"
  insertions:
    - "unit(heel + under)"
    - "through w"
    - "through -w"

oblique_thrust_sloped_tenon_notched_heel:
  title: "Oblique thrust joint with sloped tenon and notched heel"
  german: "Fersenversatz mit schrägem Zapfen"
  page: "594"
  category: "side_end"
  family: "angled"
  corners: "inclined"
  parameters:
    - "depth = 0.2"
    - "thickness = 0.3333333333333333"
  points:
    - "E = meet(O + ah*p, u, O, n)"
    - "F = meet(O - ah*p, u, O, n)"
    - "H = meet(F, -u, O - 2*depth*bh*n, n)"
    - "U = O + n"
  planes:
    - "bearing = O, n, U"
    - "heel = H, u, H + u"
    - "under = F, p, F + p"
    - "slope = E, cross(H - E, w), F"
    - "cheek_1 = O + thickness*aw*w, w, O"
    - "cheek_2 = O - thickness*aw*w, w, O"
  parts:
  steps:
    - "A2 a_end bearing heel cheek_1; a_end bearing heel cheek_2"
    - "A3 a_end slope"
    - "B2 b_node -heel -under"
    - "B3 b_node -slope -under -cheek_1 -cheek_2"
  insertions:
    - "unit(heel + under)"

oblique_thrust_mortise_tenon:
  title: "Oblique thrust joint with mortise and tenon"
  german: "Schräger Stoß mit Zapfen"
  page: "596"
  category: "side_end"
  family: "angled"
  corners: "inclined"
  parameters:
    - "depth = 0.3"
    - "thickness = 0.3333333333333333"
    - "inset = 0.1"
  points:
    - "E = meet(O + ah*p, u, O, n)"
    - "F = meet(O - ah*p, u, O, n)"
    - "M = E + (F - E)*inset"
    - "U = O + n"
  planes:
    - "bearing = O, n, U"
    - "bottom = O - 2*depth*bh*n, n, O"
    - "front = M, t, F"
    - "under = F, p, F + p"
    - "cheek_1 = O + thickness*aw*w, w, O"
    - "cheek_2 = O - thickness*aw*w, w, O"
  parts:
  steps:
    - "A2 a_end bottom"
    - "A3 a_end bearing cheek_1; a_end bearing cheek_2"
    - "A4 a_end bearing front"
    - "B2 b_node -bottom -front -under -cheek_1 -cheek_2"
  insertions:
    - "-u"
    - "-n"

oblique_thrust_sloped_mortise_tenon:
  title: "Oblique thrust joint with sloped mortise and tenon"
