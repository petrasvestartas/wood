notched_oblique_thrust_pegged_mortise_tenon:
  title: "Notched oblique thrust joint with pegged mortise and tenon"
  german: "Stirnversatz mit Zapfen und Dübelsicherung"
  page: "602"
  category: "side_end"
  family: "angled"
  corners: "inclined"
  parameters:
    - "depth = 0.2"
    - "tenon_depth = 0.45"
    - "thickness = 0.3333333333333333"
    - "peg = 0.15"
  points:
    - "E = meet(O + ah*p, u, O, n)"
    - "F = meet(O - ah*p, u, O, n)"
    - "D = meet(E, unit(-t - u), O - 2*depth*bh*n, n)"
    - "V = meet((D + F)/2, n, O - 2*tenon_depth*bh*n, n)"
    - "P = (D + V + F)/3"
  planes:
    - "front = E, cross(D - E, w), F"
    - "seat = D, cross(F - D, w), E"
    - "tenon_front = D, cross(V - D, w), F"
    - "tenon_back = V, cross(F - V, w), D"
    - "cheek_1 = O + thickness*aw*w, w, O"
    - "cheek_2 = O - thickness*aw*w, w, O"
  parts:
    - "peg = P - bw*w, P + bw*w, n, peg*ah"
  steps:
    - "A2 a_end front"
    - "A3 a_end seat cheek_1; a_end seat cheek_2"
    - "A4 a_end seat tenon_front; a_end seat tenon_back"
    - "A5 peg"
    - "B2 b -front"
    - "B3 b_node -front -seat"
    - "B4 b_node -front -tenon_front -tenon_back -cheek_1 -cheek_2"
    - "B5 peg"
  insertions:
    - "unit(front + seat)"
