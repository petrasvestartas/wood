through_dovetail_case_corner:
  title: "Through dovetail joint"
  german: "Schwalbenschwanzzinken"
  page: "832"
  category: "end_end_inplane"
  family: "corner"
  corners: "square"
  repeat: "k = max(3, 2*round((2*aw/division - 1)/2) + 1)"
  parameters:
    - "upright = 1"
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "depth = 1"
    - "division = 60"
  points:
    - "U = O + n"
    - "D = O - 2*depth*bh*n"
    - "A{k}l = O + ((k - (count - 1)/2)*(1.6/(count - 1)) - 0.07*4/(count - 1))*aw*w"
    - "B{k}l = D + ((k - (count - 1)/2)*(1.6/(count - 1)) - 0.12*4/(count - 1))*aw*w"
    - "A{k}r = O + ((k - (count - 1)/2)*(1.6/(count - 1)) + 0.07*4/(count - 1))*aw*w"
    - "B{k}r = D + ((k - (count - 1)/2)*(1.6/(count - 1)) + 0.12*4/(count - 1))*aw*w"
    - "C{k} = (O + D)/2 + (k - (count - 1)/2)*(1.6/(count - 1))*aw*w"
  planes:
    - "shoulder = O, n, U"
    - "end = D, n, O"
    - "inner = O - ah*p, p, O + p"
    - "l_{k} = A{k}l, cross(p, B{k}l - A{k}l), C{k}"
    - "r_{k} = A{k}r, cross(p, B{k}r - A{k}r), C{k}"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder l_0; a_end shoulder r_{k} l_{k+1}; a_end shoulder r_{k+count-1}"
    - "B2 b_node -inner -end -l_{k} -r_{k}"
  insertions:
    - "-p"

