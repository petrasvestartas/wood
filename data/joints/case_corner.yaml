    - "B{k}r = D + ((k - (count - 1)/2)*(1.6/(count - 1)) + 0.12*4/(count - 1))*aw*w"
    - "C{k} = (O + D)/2 + (k - (count - 1)/2)*(1.6/(count - 1))*aw*w"
  planes:
    - "shoulder = O, n, U"
    - "end = D, n, O"
    - "inner = O - ah*p, p, O + p"
    - "cog_end = O - 2*cog*bh*n, n, O"
    - "l_{k} = A{k}l, cross(p, B{k}l - A{k}l), C{k}"
    - "r_{k} = A{k}r, cross(p, B{k}r - A{k}r), C{k}"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder l_0; a_end shoulder r_{k} l_{k+1}; a_end cog_end -l_{(count - 1)/2 - k*count} -r_{(count - 1)/2 - k*count}; a_end shoulder r_{k+count-1}"
    - "B2 b_node -inner -end -l_{k + count*less((count - 1)/2 - 0.5, k)*less(k, (count - 1)/2 + 0.5)} -r_{k + count*less((count - 1)/2 - 0.5, k)*less(k, (count - 1)/2 + 0.5)}; b_node -inner -cog_end -l_{(count - 1)/2 - k*count} -r_{(count - 1)/2 - k*count}"
  insertions:
    - "-p"

