    - "shoulder = O, n, U"
    - "side_1 = O + ah*p, p, O"
    - "side_2 = O - ah*p, p, O"
    - "tongue_end = O - 2*depth*bh*n, n, O"
    - "tongue_top = O + (1 - 2*tongue)*ah*p, p, O + ah*p"
  parts:
  steps:
    - "A2 a_end tongue_end; a_end shoulder tongue_top"
    - "B2 b_node -tongue_top -tongue_end -side_2"
  insertions:
    - "-u"

splined_miter_case_corner:
  title: "Splined miter joint"
  german: "Eckverbindung auf Gehrung mit eingesetzter Feder"
  page: "824"
  category: "end_end_inplane"
  family: "corner"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "spline = 0.15"
    - "reach = 0.3"
  points:
    - "U = O + n"
    - "I = O - ah*p"
    - "X = O + ah*p - 2*bh*n"
    - "A = unit(cross(w, X - I))"
    - "D = unit(I - X)"
    - "M = (I + X)/2"
  planes:
    - "bottom = O - 2*bh*n, n, O"
    - "shoulder = O, n, U"
    - "side_1 = O + ah*p, p, O"
    - "side_2 = O - ah*p, p, O"
    - "miter = I, cross(w, X - I), O + 2*bh*n"
  parts:
    - "spline = M - (aw + 2)*w, M + (aw + 2)*w, A, spline*ah, reach*length(I - X), reach*length(I - X), none"
  steps:
    - "A2 a_end miter"
    - "A3 spline"
    - "B2 b_node -miter"
    - "B3 spline"
  insertions:
    - "-u"
    - "spline = w"

miter_spline_keys_case_corner:
  title: "Miter joint with spline keys"
