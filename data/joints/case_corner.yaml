    - "tongue_end = O - 2*depth*bh*n, n, O"
    - "split = O + (2*tongue - 1)*ah*p, p, O - ah*p"
  parts:
  steps:
    - "A2 a_end tongue_end; a_end shoulder split"
    - "B2 b_node -tongue_end -split -side_2"
