    - "M = (I + X)/2"
  planes:
    - "bottom = O - 2*bh*n, n, O"
    - "shoulder = O, n, U"
    - "side_1 = O + ah*p, p, O"
    - "side_2 = O - ah*p, p, O"
    - "miter = I, cross(w, X - I), O + 2*bh*n"
  parts:
    - "key_1 = X + 0.5*aw*w + depth*ah*D, X + 0.5*aw*w, w, key, depth*ah, 0.01*ah, end"
    - "key_2 = X - 0.5*aw*w + depth*ah*D, X - 0.5*aw*w, w, key, depth*ah, 0.01*ah, end"
  steps:
    - "A2 a_end miter"
    - "A3 key_1; key_2"
