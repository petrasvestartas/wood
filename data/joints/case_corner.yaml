    - "stock_wide = 150"
    - "spline = 0.25"
    - "reach = 0.3"
  points:
    - "U = O + n"
    - "I = O - ah*p"
    - "X = O + ah*p - 2*bh*n"
    - "A = unit(cross(w, X - I))"
    - "D = unit(I - X)"
    - "M = (I + X)/2"
  planes:
    - "bottom = O - 2*bh*n, n, O"
    - "shoulder = O, n, U"
    - "side_1 = O + ah*p, p, O"
    - "side_2 = O - ah*p, p, O"
    - "miter = I, cross(w, X - I), O + 2*bh*n"
  parts:
    - "spline = M - (aw + 2)*w, M + (aw + 2)*w, D, spline*ah, reach*length(I - X), reach*length(I - X), none"
  steps:
    - "A2 a_end miter"
    - "A3 spline"
    - "B2 b_node -miter"
    - "B3 spline"
  insertions:
    - "-u"
    - "spline = w"

