# Joinery Compendium (Bauer, Pauli 2024), Case Joints, End Joints (boards joined end to end): one record per joint, built by JointBeamElement::from_library.
#
# A record: title, german, page, category, family and corners (square, inclined or both: where the joint exists),
# every value in double quotes (the reader takes a bare dash for a
# list); then lists of quoted strings, read in order.
#   parameters  "name = number", shares of the members' sizes, each overridable by from_library; the test reads open, the
#               share of the carrier's cut a joint leaves empty on purpose.
#   points      "name = expression", in the frame of the joint (side_end: the end of member a on a side of member b):
#               A splice (family splicing): a and b on one line overlapping, O the middle of the overlap, u along a away
#               from b, p the section axis of a nearest the vertical, w across, ah and aw half of a along p and w, L half the
#               overlap; boxes a_end and b_end; the parameter lap sets the overlap the pair is drawn with, in section heights.
#               O where the axis of a meets the face of b, u along a away from b, n the face normal of b, t along b the way
#               a leans, w across both (n x t), p across a towards the side it leans to (w x u); ah and aw half of a along
#               p and w, bh and bw half of b along n and w; expressions use + * / and unit length cross dot meet.
#   planes      "name = point, normal, kept": the normal turned away from the kept point, towards the wood taken away;
#               a plane's name in an expression is its normal.
#   parts       "name = start, end, up, half[, ends]": a square peg or key from start to end, half its side wide, a side along up;
#               "name = start, end, up, half_up, half_start, half_end[, ends[, flat]]": a wedge, half_up thick along up, its
#               other half side narrowing from half_start at start to half_end at end, driven in along start to end; a folding
#               wedge keeps its face looking along flat flat;
#               its hole runs past the ends that leave the wood: both (default), start, end or none;
#               it is nested under the joint, goes in along its axis, and its name is a box the steps cut its hole with.
#   steps       "label box plane plane" labelled as the book does (A1 and B1 are its marking, so cuts start at 2),
#               regions joined by ";": the box (a_end the end of a, b_node b around the node; a or
#               b alone for a kerf that takes nothing) cut by every plane, a leading minus for the plane turned round.
#               Steps of one member overlap rather than meet, so the one boolean that takes them away leaves no skin.
#               Labels C, D, ... cut the more members; a step labelled P cuts the parts themselves (a key's hole through a spline).
#   sealed      "true" for a joint that is locked for good once assembled (a foxtail-wedged tenon): it need not come apart.
#   roll        (a parameter) turns a crossing's two sections about their axes in degrees: a diagonal puzzle's sticks stand on an edge.
#   stock       a's axis ends on b's axis; a joint whose a passes through b (a lap) needs a's stock there, its extension.
#   insertions  expressions for the ways a goes in; "through v" only when a is as wide as b; b goes in the opposite way;
#               "part = v" the way a part goes in, where it does not go in along its own axis (an inlay).
#               "v; m1; m2" approaches along v, then makes the moves m1, m2 as long as they are (in, then along the slot).

finger_end:
  title: "End-to-end finger joint"
  german: "Fingerzinkenstoß"
  page: "796"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "lap = 2"
  points:
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "c1 = O - 0.6*aw*w, w, O - 1000*w"
    - "c2 = O - 0.2*aw*w, w, O - 1000*w"
    - "c3 = O + 0.2*aw*w, w, O - 1000*w"
    - "c4 = O + 0.6*aw*w, w, O - 1000*w"
  parts:
  steps:
    - "A2 a_end shoulder_a c1 -c2; a_end shoulder_a c3 -c4"
    - "B2 b_end f2 -c1; b_end f2 c2 -c3; b_end f2 c4"
  insertions:
    - "-p"

tongue_groove_breadboard:
  title: "Tongue and groove breadboard end"
  german: "Hirnleiste mit Nut und Feder"
  page: "806"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 15"
    - "carrier_wide = 30"
    - "flat = 1"
    - "span = 150"
    - "tongue = 0.33"
    - "depth = 0.5"
  points:
    - "U = O + n"
  planes:
    - "shoulder = O, n, U"
    - "edge_1 = O + ah*p, p, O"
    - "edge_2 = O - ah*p, p, O"
    - "end = O - 2*depth*bh*n, n, O"
    - "c1 = O + tongue*aw*w, w, O"
    - "c2 = O - tongue*aw*w, w, O"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder c1; a_end shoulder c2"
    - "B2 b_node -end -c1 -c2 -edge_1 -edge_2"
  insertions:
    - "-u"

dado_tongue_breadboard:
  title: "Dado and tongue breadboard end"
  german: "Hirnleiste mit Falz und Feder"
  page: "808"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 15"
    - "carrier_wide = 30"
    - "flat = 1"
    - "span = 150"
    - "tongue = 0.33"
    - "groove = 0.7"
  points:
  planes:
    - "top = O, n, O - n"
    - "shoulder = O - groove*aw*n, n, O"
    - "c1 = O + tongue*aw*w, w, O"
    - "c2 = O - tongue*aw*w, w, O"
  parts:
  steps:
    - "A2 a_end shoulder; a_end -top -c1 -c2"
    - "B2 b_node -shoulder c1; b_node -shoulder c2"
  insertions:
    - "-u"

splined_breadboard:
  title: "Splined breadboard end"
  german: "Hirnleiste mit Nut und Fremdfeder"
  page: "804"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 15"
    - "carrier_wide = 30"
    - "flat = 1"
    - "span = 150"
    - "spline = 0.33"
    - "reach = 0.5"
  points:
    - "U = O + n"
  planes:
    - "shoulder = O, n, U"
    - "edge_1 = O + ah*p, p, O"
    - "edge_2 = O - ah*p, p, O"
  parts:
    - "spline = O - (ah + 2)*p, O + (ah + 2)*p, w, spline*aw, reach*2*bh, reach*2*bh, none"
  steps:
    - "A2 a_end shoulder"
    - "A3 spline"
    - "B3 spline"
  insertions:
    - "-u"
    - "spline = p"

haunched_mortise_tenon_breadboard:
  title: "Haunched mortise and tenon breadboard end"
  german: "Hirnleiste mit Nut, Feder und Zapfenlöchern"
  page: "810"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 15"
    - "carrier_wide = 30"
    - "flat = 1"
    - "span = 150"
    - "tongue = 0.33"
    - "haunch = 0.25"
    - "depth = 1.0"
    - "tenon = 0.2"
  points:
    - "U = O + n"
  planes:
    - "shoulder = O, n, U"
    - "edge_1 = O + ah*p, p, O"
    - "edge_2 = O - ah*p, p, O"
    - "haunch_end = O - 2*haunch*bh*n, n, O"
    - "end = O - 2*depth*bh*n, n, O"
    - "c1 = O + tongue*aw*w, w, O"
    - "c2 = O - tongue*aw*w, w, O"
    - "t1 = O + (0.5 + tenon)*ah*p, p, O"
    - "t2 = O + (0.5 - tenon)*ah*p, p, O"
    - "t3 = O - (0.5 - tenon)*ah*p, p, O"
    - "t4 = O - (0.5 + tenon)*ah*p, p, O"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder c1; a_end shoulder c2; a_end haunch_end -end t1; a_end haunch_end -end -t2 -t3; a_end haunch_end -end t4"
    - "B2 b_node -haunch_end -c1 -c2 -edge_1 -edge_2; b_node -c1 -c2 -t1 t2; b_node -c1 -c2 t3 -t4"
  insertions:
    - "-u"

dovetail_end:
  title: "End-to-end dovetail joint"
  german: "Zinkenstoß"
  page: "798"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "lap = 2.5"
    - "root = 0.1"
    - "tip = 0.18"
  points:
    - "A1l = O + L*u + (-0.6 - root)*aw*w"
    - "B1l = O - L*u + (-0.6 - tip)*aw*w"
    - "A1r = O + L*u + (-0.6 + root)*aw*w"
    - "B1r = O - L*u + (-0.6 + tip)*aw*w"
    - "C1 = O + -0.6*aw*w"
    - "A2l = O + L*u + (0.0 - root)*aw*w"
    - "B2l = O - L*u + (0.0 - tip)*aw*w"
    - "A2r = O + L*u + (0.0 + root)*aw*w"
    - "B2r = O - L*u + (0.0 + tip)*aw*w"
    - "C2 = O + 0.0*aw*w"
    - "A3l = O + L*u + (0.6 - root)*aw*w"
    - "B3l = O - L*u + (0.6 - tip)*aw*w"
    - "A3r = O + L*u + (0.6 + root)*aw*w"
    - "B3r = O - L*u + (0.6 + tip)*aw*w"
    - "C3 = O + 0.6*aw*w"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "l1 = A1l, cross(p, B1l - A1l), C1"
    - "r1 = A1r, cross(p, B1r - A1r), C1"
    - "l2 = A2l, cross(p, B2l - A2l), C2"
    - "r2 = A2r, cross(p, B2r - A2r), C2"
    - "l3 = A3l, cross(p, B3l - A3l), C3"
    - "r3 = A3r, cross(p, B3r - A3r), C3"
  parts:
  steps:
    - "A2 a_end shoulder_a l1; a_end shoulder_a r1 l2; a_end shoulder_a r2 l3; a_end shoulder_a r3"
    - "B2 b_end f2 -l1 -r1; b_end f2 -l2 -r2; b_end f2 -l3 -r3"
  insertions:
    - "-p"

dado_spline_end:
  title: "Dado with spline"
  german: "eingelassene Hirnleiste"
  page: "802"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 4"
    - "carrier_wide = 15"
    - "flat = 1"
    - "span = 150"
  points:
  planes:
    - "shoulder = O, n, O + n"
    - "far = O - 2*bh*n, n, O"
    - "g1 = O + bw*w, w, O"
    - "g2 = O - bw*w, w, O"
  parts:
  steps:
    - "A2 a_end far; a_end shoulder -far -g1 -g2"
  insertions:
    - "-u"

v_dado_spline_end:
  title: "V-shaped dado with spline"
  german: "eingelassene keilförmige Hirnleiste"
  page: "800"
  category: "side_end"
  family: "t"
  corners: "square"
  filled: ""
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 8"
    - "carrier_wide = 15"
    - "flat = 1"
    - "span = 150"
  points:
    - "B1 = O - 2*bh*n + bw*w"
    - "B2 = O - 2*bh*n - bw*w"
  planes:
    - "shoulder = O, n, O + n"
    - "far = O - 2*bh*n, n, O"
    - "v1 = O, cross(t, B1 - O), O - 2*bh*n"
    - "v2 = O, cross(t, B2 - O), O - 2*bh*n"
  parts:
  steps:
    - "A2 a_end far; a_end shoulder -far -v1 -v2"
    - "B2 b_node v1; b_node v2"
  insertions:
    - "-u"

halved_splayed_end:
  title: "Halved splayed joint"
  german: "schräg angeschnittene wechselseitige Überblattung"
  page: "794"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "lap = 12"
  points:
    - "P1 = O - L*u - aw*w"
    - "P2 = O + L*u + aw*w"
    - "Q1 = O - L*u + aw*w"
    - "Q2 = O + L*u - aw*w"
  planes:
    - "mid = O, p, O + p"
    - "d1 = P1, cross(p, P2 - P1), Q2"
    - "d2 = Q1, cross(p, Q2 - Q1), P2"
  parts:
  steps:
    - "A2 a_end d1 d2; a_end -mid d1; a_end mid d2"
    - "B2 b_end -d1 -d2; b_end -mid -d1; b_end mid -d2"
  insertions:
    - "-u"

wedged_haunched_tenon_breadboard:
  title: "Wedged and haunched tenon breadboard end"
  german: "verkeilte Hirnleiste mit Nut und Zapfenloch"
  page: "812"
  category: "side_end"
  family: "t"
  corners: "square"
  parameters:
    - "stock_thick = 12"
    - "stock_wide = 150"
    - "carrier_thick = 15"
    - "carrier_wide = 30"
    - "flat = 1"
    - "span = 150"
    - "tongue = 0.33"
    - "haunch = 0.25"
    - "depth = 1.0"
    - "slack = 0.08"
    - "tenon = 0.33"
  more:
    - "c = -75 0 -30, -75 0 330, 0 1 0, 12, 75"
  points:
    - "U = O + n"
    - "F1 = O - 2*bh*n + (tenon + slack/2)*ah*p"
    - "F2 = O - 2*bh*n - (tenon + slack/2)*ah*p"
    - "N1 = O - 2*haunch*bh*n + (tenon + slack/2)*ah*p"
    - "N2 = O - 2*haunch*bh*n - (tenon + slack/2)*ah*p"
  planes:
    - "shoulder = O, n, U"
    - "seam = O, p, O + p"
    - "edge_1 = O + ah*p, p, O"
    - "edge_2 = O - ah*p, p, O"
    - "haunch_end = O - 2*haunch*bh*n, n, O"
    - "end = O - 2*depth*bh*n, n, O"
    - "c1 = O + tongue*aw*w, w, O"
    - "c2 = O - tongue*aw*w, w, O"
    - "t1 = O + tenon*ah*p, p, O"
    - "t2 = O - tenon*ah*p, p, O"
  parts:
    - "wedge_1 = F1, N1, w, tongue*aw, slack*ah/2, 0.01*ah, start"
    - "wedge_2 = F2, N2, w, tongue*aw, slack*ah/2, 0.01*ah, start"
  steps:
    - "A2 a_all seam; a_end end; a_end shoulder c1; a_end shoulder c2; a_end haunch_end -end t1"
    - "C2 c end; c shoulder c1; c shoulder c2; c haunch_end -end t2"
    - "B2 b_node -haunch_end -c1 -c2 -edge_1 -edge_2; b_node -c1 -c2 -t1 -t2"
    - "B3 wedge_1; wedge_2"
  insertions:
    - "-u"
    - "c = -u"
    - "wedge_1 = n"
    - "wedge_2 = n"
