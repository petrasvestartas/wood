    - "shoulder_b = O - L*u, u, O - 2*L*u"
    - "upper = H1, cross(w, H2 - H1), O + 2*ah*p"
    - "cut = O, u, O + u"
    - "tip_a = O - (L - stub*ah)*u, u, O + 2*L*u"
    - "tip_b = O + (L - stub*ah)*u, u, O - 2*L*u"
