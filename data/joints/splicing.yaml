    - "A3 peg_1; peg_2"
    - "B2 b_end upper shoulder_b cut -tip_a; b_end upper shoulder_b cut tip_a -sb1 -sb2; b_end splay shoulder_b -cut -tip_a; b_end splay shoulder_b -cut tip_a -sb1 -sb2; b_end tip_b sb1; b_end tip_b sb2"
    - "B3 peg_1; peg_2"
  insertions:
    - "p"
    - "peg_1 = p"
    - "peg_2 = p"

rabbeted_gooseneck_barb_splice:
  title: "Rabbeted gooseneck joint with barb"
  german: "abgesetzter Sichelzapfen mit Steckfalz und abgesetztem Gehrungsblatt"
  page: "254"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "lap = 1.24"
    - "head = 0.47"
    - "neck = 0.24"
    - "wide = 0.42"
    - "tip = 0.32"
    - "stub = 0.25"
    - "stub_wide = 0.28"
    - "lip = 0.24"
  points:
    - "H = O + (head*2*ah - L)*u"
    - "W1 = H + wide*aw*w"
    - "E1 = O - L*u + tip*aw*w"
    - "W2 = H - wide*aw*w"
    - "E2 = O - L*u - tip*aw*w"
    - "M1 = O + (L - stub*ah)*u"
    - "M2 = O + (L - stub*ah - ah)*u + ah*p"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "butt = M1, u, O + 2*L*u"
    - "hend = H, u, O - 2*L*u"
    - "neck_1 = O + neck*aw*w, w, O"
    - "neck_2 = O - neck*aw*w, w, O"
    - "stub_1 = O + (neck + stub_wide)*aw*w, w, O"
    - "stub_2 = O - (neck + stub_wide)*aw*w, w, O"
    - "flank_1 = W1, cross(p, E1 - W1), O - L*u"
    - "flank_2 = W2, cross(p, E2 - W2), O - L*u"
    - "lvl = O, p, O + p"
    - "rabbet = O + (1 - lip)*aw*w, w, O"
    - "miter = M1, cross(w, M2 - M1), O + 2*L*u + ah*p"
  parts:
  steps:
    - "A2 a_end butt lvl; a_end butt hend neck_1 -rabbet -lvl; a_end butt rabbet -lvl miter; a_end butt hend neck_2 -lvl; a_end -hend flank_1 -lvl; a_end -hend flank_2 -lvl; a_end shoulder_a -butt neck_1 -stub_1; a_end shoulder_a -butt neck_2 -stub_2"
    - "B2 b_end -butt -neck_1 -neck_2; b_end -butt stub_1; b_end -butt stub_2; b_end hend -neck_1 -neck_2 -lvl; b_end f2 -hend -flank_1 -flank_2 -lvl; b_end butt rabbet -lvl -miter"
  insertions:
    - "-p"
