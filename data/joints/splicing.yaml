  german: "stehendes schräges Hakenblatt mit Steckfalz und doppelter Dübelsicherung"
  page: "146"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "lap = 3"
    - "stop = 0.6"
    - "cog = 0.24"
    - "lip = 0.3"
    - "rabbet = 0.3"
    - "peg = 0.13"
    - "spacing = 0.4"
    - "slope = 0.15"
  points:
    - "S1 = O - L*u - stop*aw*w"
    - "S2 = O + L*u + stop*aw*w"
    - "H1 = S1 + cog*aw*w"
    - "H2 = S2 + cog*aw*w"
    - "D1 = H1 - lip*aw*w"
    - "D2 = H2 - lip*aw*w"
    - "G1 = S1 + lip*aw*w"
    - "G2 = S2 + lip*aw*w"
  planes:
    - "splay = S1, cross(p, S2 - S1), O + 2*aw*w"
    - "upper = H1, cross(p, H2 - H1), O + 2*aw*w"
    - "low = D1, cross(p, D2 - D1), O + 2*aw*w"
    - "high = G1, cross(p, G2 - G1), O + 2*aw*w"
    - "cut = O, unit(u + slope*p), O + u"
    - "e1 = O + (L - rabbet*aw)*u, u, O + 2*L*u"
    - "e2 = O + L*u, u, O + 2*L*u"
    - "f1 = O - (L - rabbet*aw)*u, u, O - 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
  parts:
    - "peg_1 = O - spacing*L*u + 1.2*aw*w, O - spacing*L*u - 1.2*aw*w, u, peg*aw"
    - "peg_2 = O + spacing*L*u + 1.2*aw*w, O + spacing*L*u - 1.2*aw*w, u, peg*aw"
  steps:
    - "A2 a_end -upper cut; a_end -splay -cut e1; a_end -splay high -e1 e2; a_end low -f1; a_end upper -f2"
    - "B2 b_end upper cut f1; b_end upper -low f2 -f1; b_end splay -cut; b_end -high -e1; b_end -splay -e2"
    - "A3 peg_1; peg_2"
    - "B3 peg_1; peg_2"
  insertions:
    - "p"

four_faced_dovetail_splice:
  title: "Four-faced dovetail joint"
  german: "diagonaler doppelter Schwalbenschwanzzapfen"
  page: "238"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "lap = 0.4"
    - "centre = 0.7071"
    - "root = 0.23"
    - "tip = 0.33"
  points:
    - "D1 = unit(ah*p + aw*w)"
    - "D2 = unit(ah*p - aw*w)"
    - "RO1 = O + L*u + (centre + root)*ah*D2"
    - "TO1 = O - L*u + (centre + tip)*ah*D2"
    - "RI1 = O + L*u + (centre - root)*ah*D2"
    - "TI1 = O - L*u + (centre - tip)*ah*D2"
    - "RO2 = O + L*u - (centre + root)*ah*D2"
    - "TO2 = O - L*u - (centre + tip)*ah*D2"
    - "RI2 = O + L*u - (centre - root)*ah*D2"
    - "TI2 = O - L*u - (centre - tip)*ah*D2"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "o1 = RO1, cross(D1, TO1 - RO1), O"
    - "i1 = RI1, cross(D1, TI1 - RI1), O + centre*ah*D2"
    - "o2 = RO2, cross(D1, TO2 - RO2), O"
    - "i2 = RI2, cross(D1, TI2 - RI2), O - centre*ah*D2"
  parts:
  steps:
    - "A2 a_end shoulder_a o1; a_end shoulder_a i1 i2; a_end shoulder_a o2"
    - "B2 b_end f2 -o1 -i1; b_end f2 -o2 -i2"
  insertions:
    - "-D1"

four_faced_gooseneck_splice:
  title: "Four-faced gooseneck joint"
  german: "diagonaler doppelter Sichelzapfen mit Steckfalz"
  page: "260"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "lap = 1.6"
    - "centre = 0.7071"
    - "head = 0.4"
    - "neck = 0.12"
    - "wide = 0.27"
    - "tip = 0.17"
    - "stub = 0.32"
    - "corner = 1.17"
  points:
    - "D1 = unit(ah*p + aw*w)"
    - "D2 = unit(ah*p - aw*w)"
    - "H = O + (head*2*ah - L)*u"
    - "WO1 = H + (centre + wide)*ah*D2"
    - "EO1 = O - L*u + (centre + tip)*ah*D2"
    - "WI1 = H + (centre - wide)*ah*D2"
    - "EI1 = O - L*u + (centre - tip)*ah*D2"
    - "WO2 = H - (centre + wide)*ah*D2"
    - "EO2 = O - L*u - (centre + tip)*ah*D2"
    - "WI2 = H - (centre - wide)*ah*D2"
    - "EI2 = O - L*u - (centre - tip)*ah*D2"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "f2 = O - L*u, u, O - 2*L*u"
    - "rabbet = O + (L - stub*ah)*u, u, O + 2*L*u"
    - "hend = H, u, O - 2*L*u"
    - "no1 = O + (centre + neck)*ah*D2, D2, O"
    - "ni1 = O + (centre - neck)*ah*D2, D2, O + centre*ah*D2"
    - "no2 = O - (centre + neck)*ah*D2, D2, O"
    - "ni2 = O - (centre - neck)*ah*D2, D2, O - centre*ah*D2"
    - "o1 = WO1, cross(D1, EO1 - WO1), O"
    - "i1 = WI1, cross(D1, EI1 - WI1), O + centre*ah*D2"
    - "o2 = WO2, cross(D1, EO2 - WO2), O"
    - "i2 = WI2, cross(D1, EI2 - WI2), O - centre*ah*D2"
    - "cc1 = O + corner*ah*D2, D2, O"
    - "cc2 = O - corner*ah*D2, D2, O"
  parts:
  steps:
    - "A2 a_end rabbet hend no1; a_end shoulder_a -rabbet no1 -cc1; a_end shoulder_a hend ni1 ni2; a_end rabbet hend no2; a_end shoulder_a -rabbet no2 -cc2; a_end -hend o1; a_end -hend i1 i2; a_end -hend o2"
    - "B2 b_end hend -no1 -ni1; b_end hend -no2 -ni2; b_end f2 -hend -o1 -i1; b_end f2 -hend -o2 -i2; b_end -rabbet cc1; b_end -rabbet cc2"
  insertions:
    - "-D1"

tapered_dovetail_mitered_shoulders_splice:
