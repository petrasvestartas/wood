# Joinery Compendium (Bauer, Pauli 2024), Timber Joints, Splicing Joints: one record per joint, built by JointBeamElement::from_library.
#
# A record: title, german, page, category, family and corners (square, inclined or both: where the joint exists),
# every value in double quotes (the reader takes a bare dash for a
# list); then lists of quoted strings, read in order.
#   parameters  "name = number", shares of the members' sizes, each overridable by from_library; the test reads open, the
#               share of the carrier's cut a joint leaves empty on purpose.
#   points      "name = expression", in the frame of the joint (side_end: the end of member a on a side of member b):
#               A splice (family splicing): a and b on one line overlapping, O the middle of the overlap, u along a away
#               from b, p the section axis of a nearest the vertical, w across, ah and aw half of a along p and w, L half the
#               overlap; boxes a_end and b_end; the parameter lap sets the overlap the pair is drawn with, in section heights.
#               O where the axis of a meets the face of b, u along a away from b, n the face normal of b, t along b the way
#               a leans, w across both (n x t), p across a towards the side it leans to (w x u); ah and aw half of a along
#               p and w, bh and bw half of b along n and w; expressions use + * / and unit length cross dot meet.
#   planes      "name = point, normal, kept": the normal turned away from the kept point, towards the wood taken away;
#               a plane's name in an expression is its normal.
#   parts       "name = start, end, up, half[, ends]": a square peg or key from start to end, half its side wide, a side along up;
#               "name = start, end, up, half_up, half_start, half_end[, ends[, flat]]": a wedge, half_up thick along up, its
#               other half side narrowing from half_start at start to half_end at end, driven in along start to end; a folding
#               wedge keeps its face looking along flat flat;
#               its hole runs past the ends that leave the wood: both (default), start, end or none;
#               it is nested under the joint, goes in along its axis, and its name is a box the steps cut its hole with.
#   steps       "label box plane plane" labelled as the book does (A1 and B1 are its marking, so cuts start at 2),
#               regions joined by ";": the box (a_end the end of a, b_node b around the node; a or
#               b alone for a kerf that takes nothing) cut by every plane, a leading minus for the plane turned round.
#               Steps of one member overlap rather than meet, so the one boolean that takes them away leaves no skin.
#               Labels C, D, ... cut the more members; a step labelled P cuts the parts themselves (a key's hole through a spline).
#   posts       "letter = start, end, radius": a round post the member's cut keeps, an exact cylinder (a Chidori neck).
#   repeat      "k = count": the units a joint repeats by division (fingers, tenons, keys), count an expression of the
#               parameters and the frame (2*round(aw/division)); a line of points, planes, parts or insertions with a {expression}
#               is written once for k = 0 ... count - 1, the expression its whole number; in a step each such region, but for
#               one naming a unit past the count.
#   sealed      "true" for a joint that is locked for good once assembled (a foxtail-wedged tenon): it need not come apart.
#   member_turn (a parameter) turns the member alone about its own axis in degrees: a post set diagonally under a square beam.
#   member_shift (a parameter) moves the member alone across the joint in mm (along y): a post wider than its beam, flush with one face.
#   roll        (a parameter) turns a crossing's two sections about their axes in degrees: a diagonal puzzle's sticks stand on an edge.
#   stock       a's axis ends on b's axis; a joint whose a passes through b (a lap) needs a's stock there, its extension.
#   insertions  expressions for the ways a goes in; "through v" only when a is as wide as b; b goes in the opposite way;
#               "part = v" the way a part goes in, where it does not go in along its own axis (an inlay).
#               "v; m1; m2" approaches along v, then makes the moves m1, m2 as long as they are (in, then along the slot).
#               A move "turn P, d, degrees" turns the piece about the line through P along d (a Chidori stick locking).

half_lap_splice:
  title: "Half lap joint"
  german: "gerades Blatt"
  page: "42"
  category: "end_end_inplane"
  family: "splicing"
  corners: "square"
  parameters:
    - "lap = 1"
  points:
  planes:
    - "mid = O, p, O + p"
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "shoulder_b = O - L*u, u, O - 2*L*u"
  parts:
  steps:
    - "A2 a_end mid shoulder_a"
    - "B2 b_end -mid shoulder_b"
  insertions:
    - "-p"

beveled_lap_splice:
  title: "Beveled lap joint"
