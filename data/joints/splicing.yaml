    - "B2 b_end -cw1 -cw2 -tv1 -tv2; b_end -cp1 -cp2 -th1 -th2; b_end cw1 cp1 -sa1 -sb1; b_end cw1 cp2 -sa2 -sb1; b_end cw2 cp1 -sa1 -sb2; b_end cw2 cp2 -sa2 -sb2"
