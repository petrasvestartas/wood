    - "low = -0.06"
    - "high = 0.2"
  points:
    - "B1 = O - L*u + low*ah*p"
    - "B2 = O + L*u + high*ah*p"
  planes:
    - "slope = B1, cross(w, B2 - B1), O + 2*ah*p"
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "shoulder_b = O - L*u, u, O - 2*L*u"
  parts:
  steps:
    - "A2 a_end slope shoulder_a"
    - "B2 b_end -slope shoulder_b"
  insertions:
    - "-p"

