    - "span = 2.4"
    - "cog = 1.2"
    - "end = 0.6"
    - "middle = 0.4"
    - "tenon = 0.5"
    - "band = 0.33"
  points:
    - "B = O - ah*p"
    - "P1 = B - (span + tenon)*ah*u + aw*w"
    - "P2 = B + (span + tenon)*ah*u + aw*w"
    - "P3 = B + (span + tenon)*ah*u + (1 - end)*aw*w"
    - "P4 = B + cog*ah*u + (1 - end)*aw*w"
    - "P5 = B + cog*ah*u + (1 - middle)*aw*w"
    - "P6 = B - cog*ah*u + (1 - middle)*aw*w"
    - "P7 = B - cog*ah*u + (1 - end)*aw*w"
    - "P8 = B - (span + tenon)*ah*u + (1 - end)*aw*w"
  planes:
    - "shoulder_a = O + L*u, u, O + 2*L*u"
    - "r_m = O + (1 - middle)*aw*w, w, O"
    - "r_e = O + (1 - end)*aw*w, w, O"
    - "s_a = O + span*ah*u, u, O"
    - "c_a = O + cog*ah*u, u, O"
    - "t_a = O + (span + tenon)*ah*u, u, O"
    - "s_b = O - span*ah*u, u, O"
    - "c_b = O - cog*ah*u, u, O"
    - "t_b = O - (span + tenon)*ah*u, u, O"
    - "top = O + band*ah*p, p, O"
    - "bottom = O - band*ah*p, p, O"
  parts:
    - "piece = P1 P2 P3 P4 P5 P6 P7 P8, 2*ah*p"
  steps:
    - "A2 a_end shoulder_a"
    - "A3 a_end r_m -s_a; a_end r_e c_a -s_a"
    - "A4 a_end r_e c_a -t_a -top -bottom"
    - "B2 b_end r_m -s_b; b_end r_e c_b -s_b"
    - "B3 b_end r_e c_b -t_b -top -bottom"
    - "P1 a_end s_a top; a_end s_a bottom; a_end s_b top; a_end s_b bottom"
  insertions:
    - "-u"
    - "piece = -w"

