# Plate joints where two plates cross through each other (the cross family, ids 30-39), read as the in-plane records
# are (see side_side_inplane.yaml).

cross_slot:
  id: "30"
  parameters:
    - "s = 1.0"
  outlines:
    - "female 0 = -0.5, 0.5, s; -0.5, -0.5, s; -0.5, -0.5, 0; -0.5, 0.5, 0; -0.5, 0.5, s"
    - "female 0 = -0.5, 0.5, s; -0.5, -0.5, s; -0.5, -0.5, 0; -0.5, 0.5, 0; -0.5, 0.5, s"
    - "female 1 = 0.5, 0.5, s; 0.5, -0.5, s; 0.5, -0.5, 0; 0.5, 0.5, 0; 0.5, 0.5, s"
    - "female 1 = 0.5, 0.5, s; 0.5, -0.5, s; 0.5, -0.5, 0; 0.5, 0.5, 0; 0.5, 0.5, s"
    - "male 0 = 0.5, 0.5, -s; -0.5, 0.5, -s; -0.5, 0.5, 0; 0.5, 0.5, 0; 0.5, 0.5, -s"
    - "male 0 = 0.5, 0.5, -s; -0.5, 0.5, -s; -0.5, 0.5, 0; 0.5, 0.5, 0; 0.5, 0.5, -s"
    - "male 1 = 0.5, -0.5, -s; -0.5, -0.5, -s; -0.5, -0.5, 0; 0.5, -0.5, 0; 0.5, -0.5, -s"
    - "male 1 = 0.5, -0.5, -s; -0.5, -0.5, -s; -0.5, -0.5, 0; 0.5, -0.5, 0; 0.5, -0.5, -s"
  types:
    - "female 0 = insert_between_multiple_edges, insert_between_multiple_edges"
    - "female 1 = insert_between_multiple_edges, insert_between_multiple_edges"
    - "male 0 = insert_between_multiple_edges, insert_between_multiple_edges"
    - "male 1 = insert_between_multiple_edges, insert_between_multiple_edges"

cross_half_lap:
  id: "32"
  parameters:
    - "drills = 0"
    - "e1 = 0.15"
    - "e2 = 0.15"
    - "clamped = max(min(shift, 1.0), 0.0)"
    - "s = 0.05 + (clamped - 0.0) * (0.4 - 0.05) / (1.0 - 0.0)"
    - "a = 0.5 - s"
    - "b = 0.5"
    - "c = 2.0 * (b - a)"
    - "z = 0.5"
    - "p0 = vec(a, -a, 0)"
    - "p1 = vec(-a, -a, 0)"
    - "p2 = vec(-a, a, 0)"
    - "p3 = vec(a, a, 0)"
    - "p4 = vec(a + c, -a - c, 0)"
    - "p5 = vec(-a - c, -a - c, 0)"
    - "p6 = vec(-a - c, a + c, 0)"
    - "p7 = vec(a + c, a + c, 0)"
    - "p8 = vec(b, -b, z)"
    - "p9 = vec(-b, -b, z)"
    - "p10 = vec(-b, b, z)"
    - "p11 = vec(b, b, z)"
    - "p12 = vec(b, -b, -z)"
    - "p13 = vec(-b, -b, -z)"
    - "p14 = vec(-b, b, -z)"
    - "p15 = vec(b, b, -z)"
    - "v0 = ((p0 - p1) * (1.0 / (a * 2.0))) * (0.5 - a)"
    - "r0_0 = p0 + v0"
    - "r0_1 = p1 - v0"
    - "r0_2 = p2 - v0"
    - "r0_3 = p3 + v0"
    - "r1_0 = p1 - v0"
    - "r1_1 = p0 + v0"
    - "r1_2 = p8 + v0"
    - "r1_3 = p9 - v0"
    - "r2_0 = p3 + v0"
    - "r2_1 = p2 - v0"
    - "r2_2 = p10 - v0"
    - "r2_3 = p11 + v0"
    - "u3a = unit(p1 - p2)"
    - "r3_A1 = p2 - u3a * e1"
    - "r3_B1 = p1 + u3a * e1"
    - "u3c = unit(p14 - p13)"
    - "r3_C1 = p13 - u3c * e2"
    - "r3_D1 = p14 + u3c * e2"
    - "u3b = unit(r3_C1 - r3_B1)"
    - "r3_1 = r3_B1 - u3b * 0.6"
    - "r3_2 = r3_C1 + u3b * 0.6"
    - "u3d = unit(r3_A1 - r3_D1)"
    - "r3_3 = r3_D1 - u3d * 0.6"
    - "r3_0 = r3_A1 + u3d * 0.6"
    - "u4a = unit(p3 - p0)"
    - "r4_A1 = p0 - u4a * e1"
    - "r4_B1 = p3 + u4a * e1"
    - "u4c = unit(p12 - p15)"
    - "r4_C1 = p15 - u4c * e2"
    - "r4_D1 = p12 + u4c * e2"
    - "u4b = unit(r4_C1 - r4_B1)"
    - "r4_1 = r4_B1 - u4b * 0.6"
    - "r4_2 = r4_C1 + u4b * 0.6"
    - "u4d = unit(r4_A1 - r4_D1)"
    - "r4_3 = r4_D1 - u4d * 0.6"
    - "r4_0 = r4_A1 + u4d * 0.6"
    - "n0 = unit(cross(r0_1 - r0_0, r0_1 - r0_2)) * 0.5"
    - "q0_0 = r0_0 + n0"
    - "q0_1 = r0_1 + n0"
    - "q0_2 = r0_2 + n0"
    - "q0_3 = r0_3 + n0"
    - "n1 = unit(cross(r1_1 - r1_0, r1_1 - r1_2)) * 0.4"
    - "q1_0 = r1_0 + n1"
    - "q1_1 = r1_1 + n1"
    - "q1_2 = r1_2 + n1"
    - "q1_3 = r1_3 + n1"
    - "n2 = unit(cross(r2_1 - r2_0, r2_1 - r2_2)) * 0.4"
    - "q2_0 = r2_0 + n2"
    - "q2_1 = r2_1 + n2"
    - "q2_2 = r2_2 + n2"
    - "q2_3 = r2_3 + n2"
    - "n3 = unit(cross(r3_1 - r3_0, r3_1 - r3_2)) * 0.4"
    - "q3_0 = r3_0 + n3"
    - "q3_1 = r3_1 + n3"
    - "q3_2 = r3_2 + n3"
    - "q3_3 = r3_3 + n3"
    - "n4 = unit(cross(r4_1 - r4_0, r4_1 - r4_2)) * 0.4"
    - "q4_0 = r4_0 + n4"
    - "q4_1 = r4_1 + n4"
    - "q4_2 = r4_2 + n4"
    - "q4_3 = r4_3 + n4"
  outlines:
    - "female 0 = each k < 2: r0_0; r0_1; r0_2; r0_3; r0_0 as mill_project"
    - "female 0 = each k < 2: r1_0; r1_1; q1_1; q1_0; r1_0 as slice_projectsheer"
    - "female 0 = each k < 2: r2_0; r2_1; q2_1; q2_0; r2_0 as slice_projectsheer"
    - "female 0 = each k < 2: r3_0; r3_1; r3_2; r3_3; r3_0 as mill_project"
    - "female 0 = each k < 2: r4_0; r4_1; r4_2; r4_3; r4_0 as mill_project"
    - "female 0 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(0.3, 0.041421, -0.928477); vec(0.041421, 0.3, 0.928477) as drill"
    - "female 0 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(-0.3, -0.041421, -0.928477); vec(-0.041421, -0.3, 0.928477) as drill"
    - "female 0 = each k < 2*less(1.5, drills)*less(drills, 2.5): vec(0.0, 0.0, -1.0); vec(0.0, 0.0, 1.0) as drill"
    - "female 0 = each k < 2*less(2.5, drills): vec(0.0, 0.0, -1.0); vec(0.0, 0.0, 1.0) as drill_50"
    - "female 0 = each k < 2*less(2.5, drills): vec(-0.5, 0.0, -0.55); vec(0.5, 0.0, -0.55) as drill_10"
    - "female 1 = each k < 2: q0_0; q0_1; q0_2; q0_3; q0_0 as mill_project"
    - "female 1 = each k < 2: r1_3; r1_2; q1_2; q1_3; r1_3 as slice_projectsheer"
    - "female 1 = each k < 2: r2_3; r2_2; q2_2; q2_3; r2_3 as slice_projectsheer"
    - "female 1 = each k < 2: q3_0; q3_1; q3_2; q3_3; q3_0 as mill_project"
    - "female 1 = each k < 2: q4_0; q4_1; q4_2; q4_3; q4_0 as mill_project"
    - "female 1 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(0.3, 0.041421, -0.928477); vec(0.041421, 0.3, 0.928477) as drill"
    - "female 1 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(-0.3, -0.041421, -0.928477); vec(-0.041421, -0.3, 0.928477) as drill"
    - "female 1 = each k < 2*less(1.5, drills)*less(drills, 2.5): vec(0.0, 0.0, -1.0); vec(0.0, 0.0, 1.0) as drill"
    - "female 1 = each k < 2*less(2.5, drills): vec(0.0, 0.0, -1.0); vec(0.0, 0.0, 1.0) as drill_50"
    - "female 1 = each k < 2*less(2.5, drills): vec(-0.5, 0.0, -0.55); vec(0.5, 0.0, -0.55) as drill_10"
    - "male 0 = each k < 2: vec(dot(r0_0, vec(0, 1, 0)), dot(r0_0, vec(1, 0, 0)), -dot(r0_0, vec(0, 0, 1))); vec(dot(r0_1, vec(0, 1, 0)), dot(r0_1, vec(1, 0, 0)), -dot(r0_1, vec(0, 0, 1))); vec(dot(r0_2, vec(0, 1, 0)), dot(r0_2, vec(1, 0, 0)), -dot(r0_2, vec(0, 0, 1))); vec(dot(r0_3, vec(0, 1, 0)), dot(r0_3, vec(1, 0, 0)), -dot(r0_3, vec(0, 0, 1))); vec(dot(r0_0, vec(0, 1, 0)), dot(r0_0, vec(1, 0, 0)), -dot(r0_0, vec(0, 0, 1))) as mill_project"
    - "male 0 = each k < 2: vec(dot(r1_0, vec(0, 1, 0)), dot(r1_0, vec(1, 0, 0)), -dot(r1_0, vec(0, 0, 1))); vec(dot(r1_1, vec(0, 1, 0)), dot(r1_1, vec(1, 0, 0)), -dot(r1_1, vec(0, 0, 1))); vec(dot(q1_1, vec(0, 1, 0)), dot(q1_1, vec(1, 0, 0)), -dot(q1_1, vec(0, 0, 1))); vec(dot(q1_0, vec(0, 1, 0)), dot(q1_0, vec(1, 0, 0)), -dot(q1_0, vec(0, 0, 1))); vec(dot(r1_0, vec(0, 1, 0)), dot(r1_0, vec(1, 0, 0)), -dot(r1_0, vec(0, 0, 1))) as slice_projectsheer"
    - "male 0 = each k < 2: vec(dot(r2_0, vec(0, 1, 0)), dot(r2_0, vec(1, 0, 0)), -dot(r2_0, vec(0, 0, 1))); vec(dot(r2_1, vec(0, 1, 0)), dot(r2_1, vec(1, 0, 0)), -dot(r2_1, vec(0, 0, 1))); vec(dot(q2_1, vec(0, 1, 0)), dot(q2_1, vec(1, 0, 0)), -dot(q2_1, vec(0, 0, 1))); vec(dot(q2_0, vec(0, 1, 0)), dot(q2_0, vec(1, 0, 0)), -dot(q2_0, vec(0, 0, 1))); vec(dot(r2_0, vec(0, 1, 0)), dot(r2_0, vec(1, 0, 0)), -dot(r2_0, vec(0, 0, 1))) as slice_projectsheer"
    - "male 0 = each k < 2: vec(dot(r3_0, vec(0, 1, 0)), dot(r3_0, vec(1, 0, 0)), -dot(r3_0, vec(0, 0, 1))); vec(dot(r3_1, vec(0, 1, 0)), dot(r3_1, vec(1, 0, 0)), -dot(r3_1, vec(0, 0, 1))); vec(dot(r3_2, vec(0, 1, 0)), dot(r3_2, vec(1, 0, 0)), -dot(r3_2, vec(0, 0, 1))); vec(dot(r3_3, vec(0, 1, 0)), dot(r3_3, vec(1, 0, 0)), -dot(r3_3, vec(0, 0, 1))); vec(dot(r3_0, vec(0, 1, 0)), dot(r3_0, vec(1, 0, 0)), -dot(r3_0, vec(0, 0, 1))) as mill_project"
    - "male 0 = each k < 2: vec(dot(r4_0, vec(0, 1, 0)), dot(r4_0, vec(1, 0, 0)), -dot(r4_0, vec(0, 0, 1))); vec(dot(r4_1, vec(0, 1, 0)), dot(r4_1, vec(1, 0, 0)), -dot(r4_1, vec(0, 0, 1))); vec(dot(r4_2, vec(0, 1, 0)), dot(r4_2, vec(1, 0, 0)), -dot(r4_2, vec(0, 0, 1))); vec(dot(r4_3, vec(0, 1, 0)), dot(r4_3, vec(1, 0, 0)), -dot(r4_3, vec(0, 0, 1))); vec(dot(r4_0, vec(0, 1, 0)), dot(r4_0, vec(1, 0, 0)), -dot(r4_0, vec(0, 0, 1))) as mill_project"
    - "male 0 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(dot(vec(0.3, 0.041421, -0.928477), vec(0, 1, 0)), dot(vec(0.3, 0.041421, -0.928477), vec(1, 0, 0)), -dot(vec(0.3, 0.041421, -0.928477), vec(0, 0, 1))); vec(dot(vec(0.041421, 0.3, 0.928477), vec(0, 1, 0)), dot(vec(0.041421, 0.3, 0.928477), vec(1, 0, 0)), -dot(vec(0.041421, 0.3, 0.928477), vec(0, 0, 1))) as drill"
    - "male 0 = each k < 2*less(0.5, drills)*less(drills, 1.5): vec(dot(vec(-0.3, -0.041421, -0.928477), vec(0, 1, 0)), dot(vec(-0.3, -0.041421, -0.928477), vec(1, 0, 0)), -dot(vec(-0.3, -0.041421, -0.928477), vec(0, 0, 1))); vec(dot(vec(-0.041421, -0.3, 0.928477), vec(0, 1, 0)), dot(vec(-0.041421, -0.3, 0.928477), vec(1, 0, 0)), -dot(vec(-0.041421, -0.3, 0.928477), vec(0, 0, 1))) as drill"
    - "male 0 = each k < 2*less(1.5, drills)*less(drills, 2.5): vec(dot(vec(0.0, 0.0, -1.0), vec(0, 1, 0)), dot(vec(0.0, 0.0, -1.0), vec(1, 0, 0)), -dot(vec(0.0, 0.0, -1.0), vec(0, 0, 1))); vec(dot(vec(0.0, 0.0, 1.0), vec(0, 1, 0)), dot(vec(0.0, 0.0, 1.0), vec(1, 0, 0)), -dot(vec(0.0, 0.0, 1.0), vec(0, 0, 1))) as drill"
