    - "male 0 = each k < 2*less(2.5, drills): vec(dot(vec(-0.5, 0.0, -0.55), vec(0, 1, 0)), dot(vec(-0.5, 0.0, -0.55), vec(1, 0, 0)), -dot(vec(-0.5, 0.0, -0.55), vec(0, 0, 1))); vec(dot(vec(0.5, 0.0, -0.55), vec(0, 1, 0)), dot(vec(0.5, 0.0, -0.55), vec(1, 0, 0)), -dot(vec(0.5, 0.0, -0.55), vec(0, 0, 1))) as drill_10"
