    - "female 0 = each j < 2 * count: -0.40237, 0.6, 0 + (z0 - step * ((j - mod(j, 2)) / 2)); 0.502961, 0.6, -0.375 + (z0 - step * ((j - mod(j, 2)) / 2)); 1.0, 0.6, -0.375 + (z0 - step * ((j - mod(j, 2)) / 2)); 1.0, 0.6, 0.375 + (z0 - step * ((j - mod(j, 2)) / 2)); 0.502961, 0.6, 0.375 + (z0 - step * ((j - mod(j, 2)) / 2)); -0.40237, 0.6, 0 + (z0 - step * ((j - mod(j, 2)) / 2))"
