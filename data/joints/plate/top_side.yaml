top_side_tenons:
  id: "20"
  female_fabrication: "hole"
  parameters:
    - "clamped = max(8, min(100, divisions))"
    - "div = clamped - mod(clamped, 4)"
    - "vz = sign(shift) * (shift * 1.0 - 0.5) / (div + 1)"
  outlines:
    - "male 1 = repeat q < div / 4: -0.5, -0.5, (-0.5 + ((4*q) + 1)/(div + 1)) + vz; -0.5, 0.5, (-0.5 + ((4*q) + 1)/(div + 1)) + vz; -0.5, 0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) - vz; -0.5, -0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) - vz | -0.5, -0.5, (-0.5 + ((div - 1) + 1)/(div + 1)) - vz"
    - "male 1 = ends"
    - "male 0 = repeat q < div / 4: 0.5, -0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz; 0.5, 0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz; 0.5, 0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) + vz; 0.5, -0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) + vz | 0.5, -0.5, (-0.5 + ((div - 1) + 1)/(div + 1)) + vz"
    - "male 0 = ends"
    - "female 0 = each q < div / 4: 0.5, -0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz; 0.5, -0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) + vz; -0.5, -0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) - vz; -0.5, -0.5, (-0.5 + ((4*q) + 1)/(div + 1)) + vz; 0.5, -0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz"
    - "female 0 = 0.5, -0.5, (-0.5 + ((4*0) + 1)/(div + 1)) - vz; -0.5, -0.5, (-0.5 + ((4*0) + 1)/(div + 1)) + vz; -0.5, -0.5, (-0.5 + ((4*(div / 4 - 1)) + 1)/(div + 1)) + vz; 0.5, -0.5, (-0.5 + ((4*(div / 4 - 1)) + 1)/(div + 1)) - vz; 0.5, -0.5, (-0.5 + ((4*0) + 1)/(div + 1)) - vz"
    - "female 1 = each q < div / 4: 0.5, 0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz; 0.5, 0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) + vz; -0.5, 0.5, (-0.5 + ((4*q + 1) + 1)/(div + 1)) - vz; -0.5, 0.5, (-0.5 + ((4*q) + 1)/(div + 1)) + vz; 0.5, 0.5, (-0.5 + ((4*q) + 1)/(div + 1)) - vz"
    - "female 1 = 0.5, 0.5, (-0.5 + ((4*0) + 1)/(div + 1)) - vz; -0.5, 0.5, (-0.5 + ((4*0) + 1)/(div + 1)) + vz; -0.5, 0.5, (-0.5 + ((4*(div / 4 - 1)) + 1)/(div + 1)) + vz; 0.5, 0.5, (-0.5 + ((4*(div / 4 - 1)) + 1)/(div + 1)) - vz; 0.5, 0.5, (-0.5 + ((4*0) + 1)/(div + 1)) - vz"

