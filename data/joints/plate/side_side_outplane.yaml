side_side_outplane_capped_fingers:
  parameters:
    - "half = max(2, min(20, divisions))"
    - "div = half + mod(half, 2)"
    - "n = div / 2"
    - "d = 1.0 / (4 * n + 2)"
  outlines:
    - "female 0 = 0.5, 0.5, -0.5 | repeat k < 2 * n: 0.5, pick(mod(k, 2), -0.5, 0.5), -(2 * n - 1 - 2 * k) * d; 0.5, pick(mod(k, 2), 0.5, -0.5), -(2 * n - 1 - 2 * k) * d | 0.5, 0.5, 0.5"
    - "female 0 = ends"
    - "female 1 = -0.5, 0.5, -0.5 | repeat k < 2 * n: -0.5, pick(mod(k, 2), -0.5, 0.5), -(2 * n - 1 - 2 * k) * d; -0.5, pick(mod(k, 2), 0.5, -0.5), -(2 * n - 1 - 2 * k) * d | -0.5, 0.5, 0.5"
    - "female 1 = ends"
    - "male 0 = -0.5, 0.5, 0.5 | repeat k < 2 * n: pick(mod(k, 2), 0.5, -0.5), 0.5, (2 * n - 1 - 2 * k) * d; pick(mod(k, 2), -0.5, 0.5), 0.5, (2 * n - 1 - 2 * k) * d | -0.5, 0.5, -0.5"
    - "male 0 = ends"
    - "male 1 = -0.5, -0.5, 0.5 | repeat k < 2 * n: pick(mod(k, 2), 0.5, -0.5), -0.5, (2 * n - 1 - 2 * k) * d; pick(mod(k, 2), -0.5, 0.5), -0.5, (2 * n - 1 - 2 * k) * d | -0.5, -0.5, -0.5"
    - "male 1 = ends"

side_side_outplane_tenons:
  id: "14"
  named: "false"
  male_fabrication: "insert_between_multiple_edges"
  female_fabrication: "hole"
  parameters:
    - "t = 0.0"
    - "chamfer = 1"
    - "modify = 1"
    - "x0 = -0.5"
    - "x1 = 0.5"
    - "y0 = -0.5"
    - "y1 = 0.5"
    - "z0e = -0.5"
    - "z1e = 0.5"
    - "on = less(0, divisions)"
    - "n0 = min(50, max(2, divisions)) * 2"
    - "step0 = 1.0 / (n0 - 1)"
    - "za = z0e + step0"
    - "zb = z1e - step0"
    - "n = n0 - 2"
    - "step = 1.0 / (n - 1)"
    - "dz = (za - zb) * step"
  outlines:
    - "male 0 = -1*x1, y0, z1e; x1 + 0*0.01, y0, z1e | repeat i < n*on: if (1 - mod(i, 2))*(1 - modify): x1, y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.05; if (1 - (1 - mod(i, 2)))*chamfer: -0.75 + x0, y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*((t*0.5) + ((1 - t)*0.5*0.25)); pick((1 - mod(i, 2)), x1, x0), y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.5; pick((1 - mod(i, 2)), x0, x1), y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.5; if (1 - mod(i, 2))*chamfer: -0.75 + x0, y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*((t*0.5) + ((1 - t)*0.5*0.25)); if (1 - (1 - mod(i, 2)))*(1 - modify): x1, y0, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.05 | x1 + 0*0.01, y0, z0e; -1*x1, y0, z0e"
    - "male 0 = ends"
    - "male 1 = 1*x1, y1, z1e; x1 + 1*0.01, y1, z1e | repeat i < n*on: if (1 - mod(i, 2))*(1 - modify): x1, y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.05; if (1 - (1 - mod(i, 2)))*chamfer: -0.75 + x0, y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*((t*0.5) + ((1 - t)*0.5*0.25)); pick((1 - mod(i, 2)), x1, x0), y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.5; pick((1 - mod(i, 2)), x0, x1), y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.5; if (1 - mod(i, 2))*chamfer: -0.75 + x0, y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*((t*0.5) + ((1 - t)*0.5*0.25)); if (1 - (1 - mod(i, 2)))*(1 - modify): x1, y1, (zb + dz*i) + pick(1 - mod(i, 2), 1, -1)*dz*t*0.05 | x1 + 1*0.01, y1, z0e; 1*x1, y1, z0e"
    - "male 1 = ends"
    - "female 0 = each k < modify: y1, 1*y1, z1e; y1, 3*y0, z1e; y1, 3*y0, z0e; y1, 1*y1, z0e as insert_between_multiple_edges"
    - "female 0 = each k < modify: y1, 1*y1, z1e; y1, 1*y1, z1e as insert_between_multiple_edges"
    - "female 0 = each k < n*on: y1, y0, (zb + dz*(k - mod(k, 2))) + dz*t*0.5; y1, y1, (zb + dz*(k - mod(k, 2))) + dz*t*0.5; y1, y1, (zb + dz*((k - mod(k, 2)) + 1)) - dz*t*0.5; y1, y0, (zb + dz*((k - mod(k, 2)) + 1)) - dz*t*0.5; y1, y0, (zb + dz*(k - mod(k, 2))) + dz*t*0.5"
    - "female 1 = each k < modify: y0, -1*y1, z1e; y0, 3*y0, z1e; y0, 3*y0, z0e; y0, -1*y1, z0e as insert_between_multiple_edges"
    - "female 1 = each k < modify: y0, -1*y1, z1e; y0, -1*y1, z1e as insert_between_multiple_edges"
    - "female 1 = each k < n*on: y0, y0, (zb + dz*(k - mod(k, 2))) + dz*t*0.5; y0, y1, (zb + dz*(k - mod(k, 2))) + dz*t*0.5; y0, y1, (zb + dz*((k - mod(k, 2)) + 1)) - dz*t*0.5; y0, y0, (zb + dz*((k - mod(k, 2)) + 1)) - dz*t*0.5; y0, y0, (zb + dz*(k - mod(k, 2))) + dz*t*0.5"
