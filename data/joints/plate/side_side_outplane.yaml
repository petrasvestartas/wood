    - "female 0 = 0.5, 0.5, 0.3; 0.5, 0.5, -0.3"
    - "female 0 = 0.5, -0.5, 0.15; 0.5, 0.5, 0.15; 0.5, 0.5, -0.15; 0.5, -0.5, -0.15; 0.5, -0.5, 0.15"
    - "female 0 = 0.5, -0.5, 0.15; 0.5, 0.5, 0.15; 0.5, 0.5, -0.15; 0.5, -0.5, -0.15; 0.5, -0.5, 0.15"
    - "female 1 = -0.5, -0.499975, 0.3; -0.5, -1.49995, 0.3; -0.5, -1.49995, -0.3; -0.5, -0.5, -0.3"
    - "female 1 = -0.5, -0.499975, 0.3; -0.5, -0.5, -0.3"
    - "female 1 = -0.5, -0.499975, 0.15; -0.5, 0.500025, 0.15; -0.5, 0.500025, -0.15; -0.5, -0.499975, -0.15; -0.5, -0.499975, 0.15"
    - "female 1 = -0.5, -0.499975, 0.15; -0.5, 0.500025, 0.15; -0.5, 0.500025, -0.15; -0.5, -0.499975, -0.15; -0.5, -0.499975, 0.15"
    - "male 0 = -0.5, -0.5, 0.3; 0.5, -0.5, 0.3; 0.5, -0.5, 0.15; -0.5, -0.5, 0.15; -0.5, -0.5, -0.15; 0.5, -0.5, -0.15; 0.5, -0.5, -0.3; -0.5, -0.5, -0.3"
