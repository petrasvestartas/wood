# Plate joints between two plates meeting at an angle along an edge (the out-of-plane family, ids 10-19), read as the
# in-plane records are (see side_side_inplane.yaml): x and y across the two plates, z along the joint line.

side_side_outplane_three_fingers:
  id: "12"
  parameters:
    - "a = 0.357142857142857"
    - "b = 0.214285714285714"
    - "c = 0.0714285714285715"
  outlines:
    - "female 0 = 0.5, 0.5, -a; 0.5, -0.5, -a; 0.5, -0.5, -b; 0.5, 0.5, -b; 0.5, 0.5, -c; 0.5, -0.5, -c; 0.5, -0.5, c; 0.5, 0.5, c; 0.5, 0.5, b; 0.5, -0.5, b; 0.5, -0.5, a; 0.5, 0.5, a"
    - "female 0 = 0.5, 0.5, -0.5; 0.5, 0.5, 0.5"
    - "female 1 = -0.5, 0.5, -a; -0.5, -0.5, -a; -0.5, -0.5, -b; -0.5, 0.5, -b; -0.5, 0.5, -c; -0.5, -0.5, -c; -0.5, -0.5, c; -0.5, 0.5, c; -0.5, 0.5, b; -0.5, -0.5, b; -0.5, -0.5, a; -0.5, 0.5, a"
    - "female 1 = -0.5, 0.5, -0.5; -0.5, 0.5, 0.5"
    - "male 0 = -0.5, 0.5, a; 0.5, 0.5, a; 0.5, 0.5, b; -0.5, 0.5, b; -0.5, 0.5, c; 0.5, 0.5, c; 0.5, 0.5, -c; -0.5, 0.5, -c; -0.5, 0.5, -b; 0.5, 0.5, -b; 0.5, 0.5, -a; -0.5, 0.5, -a"
    - "male 0 = -0.5, 0.5, 0.5; -0.5, 0.5, -0.5"
    - "male 1 = -0.5, -0.5, a; 0.5, -0.5, a; 0.5, -0.5, b; -0.5, -0.5, b; -0.5, -0.5, c; 0.5, -0.5, c; 0.5, -0.5, -c; -0.5, -0.5, -c; -0.5, -0.5, -b; 0.5, -0.5, -b; 0.5, -0.5, -a; -0.5, -0.5, -a"
    - "male 1 = -0.5, -0.5, 0.5; -0.5, -0.5, -0.5"

side_side_outplane_fingers:
  id: "10"
  parameters:
    - "half = max(2, min(20, divisions))"
    - "div = half + mod(half, 2)"
    - "vz = sign(shift) * (shift * 1.0 - 0.5) / (div + 1)"
  outlines:
    - "male 0 = repeat j < div: 0.5 - (1 - mod(j, 2)), -0.5, -0.5 + (j + 1) / (div + 1) + vz * mod(j, 2); -0.5 + (1 - mod(j, 2)), -0.5, -0.5 + (j + 1) / (div + 1) + vz * mod(j, 2)"
    - "male 0 = ends"
    - "male 1 = repeat j < div: 0.5 - (1 - mod(j, 2)), 0.5, -0.5 + (j + 1) / (div + 1) + vz * (1 - mod(j, 2)); -0.5 + (1 - mod(j, 2)), 0.5, -0.5 + (j + 1) / (div + 1) + vz * (1 - mod(j, 2))"
    - "male 1 = ends"
    - "female 0 = repeat j < div: 0.5, -0.5 + (1 - mod(j, 2)), -0.5 + (j + 1) / (div + 1) + vz; 0.5, 0.5 - (1 - mod(j, 2)), -0.5 + (j + 1) / (div + 1)"
    - "female 0 = ends"
    - "female 1 = repeat j < div: -0.5, (1 - mod(j, 2)) - 0.5, -0.5 + (j + 1) / (div + 1) + vz; -0.5, 0.5 - (1 - mod(j, 2)), -0.5 + (j + 1) / (div + 1)"
    - "female 1 = ends"

side_side_outplane_graded_fingers:
  id: "11"
  parameters:
    - "half = max(4, min(20, divisions))"
    - "div = half + mod(half, 2)"
    - "mid = div * 0.5 - mod(div * 0.5, 1)"
    - "vz = sign(shift) * (-0.5 + shift * 1.0) / (div + 1)"
  outlines:
    - "male 1 = repeat j < div: pick((1 - mod(j, 2)), 0.5, -0.5), pick((1 - mod(j, 2)), -0.5, -0.5), pick((1 - mod(j, 2)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1)) - 4*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j))); pick((1 - mod(j, 2)), -0.5, 0.5), pick((1 - mod(j, 2)), -0.5, -0.5), pick((1 - mod(j, 2)), (-0.5 + (j + 1)/(div + 1)) - 4*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)))"
    - "male 1 = ends"
    - "male 0 = repeat j < div: pick(mod(j, 2), -0.5, 0.5), pick(mod(j, 2), 0.5, 0.5), pick(mod(j, 2), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1))); pick(mod(j, 2), 0.5, -0.5), pick(mod(j, 2), 0.5, 0.5), pick(mod(j, 2), (-0.5 + (j + 1)/(div + 1)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)))"
    - "male 0 = ends"
    - "female 0 = repeat j < div: pick((1 - mod(j, 2)), -0.5, -0.5), pick((1 - mod(j, 2)), -0.5, 0.5), pick((1 - mod(j, 2)), (-0.5 + (j + 1)/(div + 1)) - 4*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j))); pick((1 - mod(j, 2)), -0.5, -0.5), pick((1 - mod(j, 2)), 0.5, -0.5), pick((1 - mod(j, 2)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1)) - 4*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)))"
    - "female 0 = ends"
    - "female 1 = repeat j < div: pick(mod(j, 2), 0.5, 0.5), pick(mod(j, 2), 0.5, -0.5), pick(mod(j, 2), (-0.5 + (j + 1)/(div + 1)), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j))); pick(mod(j, 2), 0.5, 0.5), pick(mod(j, 2), -0.5, 0.5), pick(mod(j, 2), (-0.5 + (j + 1)/(div + 1)) - 2*vz*(2*less(j, mid) - 1)*(less(j, mid - 1) + less(mid, j)), (-0.5 + (j + 1)/(div + 1)))"
    - "female 1 = ends"

