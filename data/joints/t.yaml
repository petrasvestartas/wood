# Joinery Compendium (Bauer, Pauli 2024), Timber Joints, T-Joints: one record per joint, built by JointBeamElement::from_library.
#
# A record: title, german, page, category, family and corners (square, inclined or both: where the joint exists),
# every value in double quotes (the reader takes a bare dash for a
# list); then lists of quoted strings, read in order.
#   parameters  "name = number", shares of the members' sizes, each overridable by from_library.
#   points      "name = expression", in the frame of the joint (side_end: the end of member a on a side of member b):
#               O where the axis of a meets the face of b, u along a away from b, n the face normal of b, t along b the way
#               a leans, w across both (n x t), p across a towards the side it leans to (w x u); ah and aw half of a along
#               p and w, bh and bw half of b along n and w; expressions use + * / and unit length cross dot meet.
#   planes      "name = point, normal, kept": the normal turned away from the kept point, towards the wood taken away;
#               a plane's name in an expression is its normal.
#   parts       "name = start, end, up, half[, ends]": a square peg or key from start to end, half its side wide, a side along up;
#               its hole runs past the ends that leave the wood: both (default), start, end or none;
#               it is nested under the joint, goes in along its axis, and its name is a box the steps cut its hole with.
#   steps       "label box plane plane" labelled as the book does (A1 and B1 are its marking, so cuts start at 2),
#               regions joined by ";": the box (a_end the end of a, b_node b around the node; a or
#               b alone for a kerf that takes nothing) cut by every plane, a leading minus for the plane turned round.
#               Steps of one member overlap rather than meet, so the one boolean that takes them away leaves no skin.
#   stock       a's axis ends on b's axis; a joint whose a passes through b (a lap) needs a's stock there, its extension.
#   insertions  expressions for the ways a goes in; "through v" only when a is as wide as b; b goes in the opposite way.

blind_mortise_tenon:
  title: "Blind mortise and tenon"
  german: "verdeckter Zapfen"
  page: "496"
  category: "side_end"
  family: "t"
  corners: "square inclined"
  parameters:
    - "thickness = 0.3333333333333333"
    - "depth = 0.5"
  points:
    - "S = O + n"
  planes:
    - "end = O - 2*depth*bh*n, n, O"
    - "shoulder = O, n, S"
    - "cheek_1 = O + thickness*aw*w, w, O"
    - "cheek_2 = O - thickness*aw*w, w, O"
    - "edge_1 = O + ah*p, p, O"
    - "edge_2 = O - ah*p, p, O"
  parts:
  steps:
    - "A2 a_end end; a_end shoulder cheek_1; a_end shoulder cheek_2"
    - "B2 b_node -end -cheek_1 -cheek_2 -edge_1 -edge_2"
  insertions:
    - "-u"
    - "-n"

