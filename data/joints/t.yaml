    - "low_near = O + (2*near - 1)*bw*w, w, O - 2*bw*w"
    - "low_far = O + (2*far - 1)*bw*w, w, O - 2*bw*w"
    - "stub_top = O + (2*(near + stub) - 1)*bw*w, w, O - 2*bw*w"
    - "stub_1 = O + stub_width*ah*p, p, O"
    - "stub_2 = O - stub_width*ah*p, p, O"
    - "stub_end = O - 2*stub_length*bh*n, n, O"
    - "face_1 = O + ah*p, p, O"
    - "face_2 = O - ah*p, p, O"
  parts:
