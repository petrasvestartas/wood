    - "A2 a_end bottom"
    - "A3 a_end half low_far"
    - "A4 a_end shoulder stub_top; a_end shoulder low_near stub_1; a_end shoulder low_near stub_2; a_end stub_end low_near"
    - "B2 b_node -low_near -half -face_1 -face_2; b_node -low_far half -face_1 -face_2"
    - "B3 b_node -stub_top low_near -stub_1 -stub_2 -stub_end"
  insertions:
    - "w"

