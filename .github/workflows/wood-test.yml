name: Wood Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    # ubuntu-22.04 defaults to GCC 11, which cannot compile this project's
    # C++23 - it fails inside <type_traits> with "'size_t' has not been
    # declared". 24.04 ships GCC 13. wood_nano hit the same wall and pins
    # manylinux_2_28 for gcc 12+ for exactly this reason.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: cmake/wood_test/package-lock.json

    - name: Configure CMake
      run: cmake -B cmake/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build cmake/build --config Release --parallel 4

    - name: Run wood (generates testData.js)
      working-directory: cmake/build
      run: ./wood

    - name: Copy tree-sitter WASM files
      working-directory: cmake/wood_test
      run: |
        npm ci
        mkdir -p public
        WASM_SRC="node_modules/tree-sitter-wasms/out"
        if [ -d "$WASM_SRC" ]; then
          cp "${WASM_SRC}/tree-sitter-cpp.wasm" public/ 2>/dev/null || true
        fi
        TS_WASM="node_modules/web-tree-sitter/tree-sitter.wasm"
        if [ -f "$TS_WASM" ]; then
          cp "$TS_WASM" public/ 2>/dev/null || true
        fi

    - name: Build Vue app
      working-directory: cmake/wood_test
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wood-test-website
        path: cmake/wood_test/dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: wood-test-website
        path: dist

    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
