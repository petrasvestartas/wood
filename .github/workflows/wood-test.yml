name: Wood Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # ubuntu-22.04 defaults to GCC 11, which cannot compile this project's
    # C++23 - it fails inside <type_traits> with "'size_t' has not been
    # declared". 24.04 ships GCC 13. wood_nano hit the same wall and pins
    # manylinux_2_28 for gcc 12+ for exactly this reason.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    # Everything is built, not one target: a failure in one layer hides the next one behind it.
    - name: Build
      run: cmake --build build --config Release --parallel 4

    # Every dataset through the solver. The wall-clock limit is ten minutes (the sweep takes seconds): anything
    # longer is a wedged process, not a slow one. stdbuf keeps the output if the process dies, since a crash
    # never flushes a buffered stdout.
    - name: Run all datasets
      run: |
        stdbuf -oL -eL timeout 600 build/main_all_datasets

    # Every example on the element and joint pages runs, one after another; a page never shows code that does not.
    - name: Element examples
      run: |
        for example in build/element_*; do
          [ -x "$example" ] && [ -f "$example" ] || continue
          echo "$example"
          timeout 300 "$example" > /dev/null
        done

    # The geometry oracle: every plate joint design on a joined pair, checked for closed
    # outlines, closed solids, no interpenetration, material conservation, male-female fit,
    # drills, a protobuf round trip, a rigid motion and the committed goldens under
    # tests/golden/joint_library. The table names every failing variant; exit 1 only when a
    # variant of tests/golden/joint_library/passing.txt fails, a regression.
    - name: Joint library oracle
      run: |
        stdbuf -oL -eL timeout 600 build/joint_library

    # The scoreboard against the 2025 CGAL solver: tests/golden/reference_2025/<name>.json
    # (committed, written by tools/reference_2025.py) against the port's merged outlines per
    # plate. Exit 1 when a dataset throws or one listed in matched.txt stops matching.
    - name: Reference datasets
      run: |
        stdbuf -oL -eL timeout 600 build/reference_datasets

    # The Hilti connector folded 0 to 50 degrees: the same parts at every angle, inside their slabs, filling their pockets.
    - name: Hilti connector
      run: |
        stdbuf -oL -eL timeout 600 build/joint_hilti

    # The connectors' pins: headed pins bore their pre-drilled holes, the let-in plate's pins run across their members.
    - name: Pins
      run: |
        stdbuf -oL -eL timeout 600 build/joint_pins

    # The beam dataset: every pair joined as 2024 joined it, on the boxes of its volumes, and its beams cut.
    - name: Beam joints
      run: |
        stdbuf -oL -eL timeout 600 build/joint_beams

    # The boundary family: border on a border contact and through the dataset boundary_side, against the 2025 reference.
    - name: Border joints
      run: |
        stdbuf -oL -eL timeout 600 build/joint_border

    # Butts of beams and plates drawn on lines and mid-planes: posts on a sill, a small house, every face flush and no two members overlapping.
    - name: Butt joints
      run: |
        stdbuf -oL -eL timeout 600 build/joint_butt

    # A massing whose facets miss the pattern's rays: no sliver bays, no head past the facade
    - name: Grid massing
      run: |
        stdbuf -oL -eL timeout 600 build/grid_massing

    # Joint types and insertion vectors by points and lines: every sidecar dataset solved through the two functions gives the sidecars' joints.
    - name: Plate assignment
      run: |
        stdbuf -oL -eL timeout 600 build/plate_assignment

  # The committed generated sources must be what the pinned protoc makes of src/proto: a hand edit or a
  # forgotten regeneration fails here. Regenerate with `bash tools/regen_proto.sh` (C++) and `cargo build`
  # in rust/ (Rust), then commit the result.
  proto-fresh:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    # the shared messages the wood protos import live in the session repository; session_proto
    # and session_rust are submodules of it, so a sparse checkout alone leaves them empty.
    # The commit is the superproject's `session` pointer; bump it with the pointer.
    - name: Fetch session_proto and session_rust
      run: |
        SESSION_COMMIT=710cb875b5fd1c9e77e6e93f2d990d8cfa2e4b54
        git init -q ../session
        git -C ../session fetch --depth 1 https://github.com/petrasvestartas/session.git "$SESSION_COMMIT"
        git -C ../session checkout -q FETCH_HEAD
        git -C ../session submodule update --init --depth 1 session_proto session_rust

    - uses: arduino/setup-protoc@v3
      with:
        version: '36.2' # the kernel's pin: session_cpp PROTOC_VERSION
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Regenerate the C++ sources
      run: WOOD_PROTOC="$(command -v protoc)" bash tools/regen_proto.sh

    - name: Regenerate the Rust sources
      run: PROTOC="$(command -v protoc)" cargo build --manifest-path rust/Cargo.toml

    - name: Fail on a difference
      run: |
        git status --short generated rust/src/proto
        git diff --exit-code -- generated rust/src/proto
