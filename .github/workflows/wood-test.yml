name: Wood Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # ubuntu-22.04 defaults to GCC 11, which cannot compile this project's
    # C++23 - it fails inside <type_traits> with "'size_t' has not been
    # declared". 24.04 ships GCC 13. wood_nano hit the same wall and pins
    # manylinux_2_28 for gcc 12+ for exactly this reason.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev

    # This used to configure into cmake/build and then run `./wood`, a target
    # only the legacy cmake/CMakeLists.txt ever produced. `cmake -B cmake/build`
    # with no -S configures the ROOT project, which builds main_hello,
    # main_all_datasets and friends - there is no single `wood` binary any more
    # - so the run step died with "./wood: No such file or directory", exit 127,
    # regardless of whether the build itself had worked.
    #
    # The Vue test-viewer steps that followed are gone with it: they published
    # cmake/wood_test to gh-pages from testData.js, which only that legacy
    # `wood` binary wrote. Reviving them means reviving the pre-migration CGAL
    # tree under cmake/; if the site is still wanted, that is its own job and
    # should build the legacy project explicitly with `cmake -S cmake`.
    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    # Build everything rather than one target. The failures here come in
    # layers, and building a single target just hides the next one behind it.
    - name: Build
      run: cmake --build build --config Release --parallel 4

    # This sweep has never actually run on Linux - CI died at the build, or at
    # the old `./wood` step, long before reaching it - and it segfaults here
    # within 0.1 s while working fine on Windows. stdbuf keeps the output when
    # the process dies, since a segfault never flushes a buffered stdout, and
    # gdb turns "exit 139" into a stack to read.
    # gdb already placed the crash: face_to_face_wood <- get_connection_zones
    # <- type_plates_name_joint_linking_vidychapel_corner, the second dataset.
    # A Release build has no line numbers, so this rebuilds that one target with
    # -g and ASan/UBSan to get the exact file:line and the kind of fault.
    - name: Diagnose
      continue-on-error: true
      run: |
        cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_CXX_FLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        cmake --build build-asan --target main_all_datasets --parallel 4
        ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 \
        UBSAN_OPTIONS=print_stacktrace=1 \
        stdbuf -oL -eL timeout 900 build-asan/main_all_datasets 2>&1 | tail -60

    # Bounded on purpose, see CLAUDE.md: the sweep is ~2.5 s and ~0.3 GB, so
    # ten minutes detects a wedged process rather than budgeting for a slow one.
    # timeout exits 124 on expiry.
    - name: Run all datasets
      run: |
        stdbuf -oL -eL timeout 600 build/main_all_datasets
