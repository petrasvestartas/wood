name: Wood Docs

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The docs target is a CMake target, so the project is configured once (session_cpp and
    # protobuf arrive through FetchContent) and only `docs` is built; Doxygen does the rest.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake curl
        curl -fsSL "https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz" -o /tmp/doxygen.tar.gz
        tar -xzf /tmp/doxygen.tar.gz -C /tmp
        sudo install -m 755 "$(find /tmp/doxygen-1.15.0 -type f -name doxygen | head -n 1)" /usr/local/bin/doxygen
        doxygen --version

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build docs
      run: cmake --build build --target docs

    - uses: actions/upload-pages-artifact@v3
      with:
        path: build/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
