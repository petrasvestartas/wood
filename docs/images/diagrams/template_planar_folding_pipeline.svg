<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 255" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="255" class="bg"/>
  <text x="16" y="22" class="title">PLANAR FOLDED PLATES — PRIMARY INPUTS, STRIP TRIANGULATION &amp; MULTI-PLATE NODE OFFSET</text>

  <!-- Panel 1: Primary Inputs -->
  <rect x="14" y="34" width="308" height="206" class="panel-warm"/>
  <rect x="24" y="42" width="154" height="16" class="badge-amber"/>
  <text x="101" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="186" y="53" class="mono-sm">profiles / stations</text>
  <!-- Zigzag profile + station polylines + polygon ring -->
  <polyline points="32,126 58,84 84,126 110,84 136,126" fill="none" stroke="#0284c7" stroke-width="2.4"/>
  <polyline points="154,84 180,126 206,84 232,126" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="3,2"/>
  <polygon points="268,78 298,95 298,125 268,142 242,125 242,95" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="84" y="75" text-anchor="middle" class="mono-blue">zigzag / polygon</text>
  <text x="193" y="75" text-anchor="middle" class="mono-red">stations</text>
  <text x="270" y="72" text-anchor="middle" class="mono-green">n-gon ring</text>
  <text x="26" y="162" class="mono-sm">• PrismaticFold: profile, span, diaphragms, flange</text>
  <text x="26" y="177" class="mono-sm">• CounterFold / ConicalFold: station Polylines</text>
  <text x="26" y="192" class="mono-sm">• FoldedFrame: arch/portal stations + zigzag</text>
  <text x="26" y="207" class="mono-sm">• Single / Diagonal / Triangle / Pyramid: plan</text>
  <text x="26" y="222" class="mono-sm">• ReflexFold / DiamondMesh: NurbsSurface + u,v</text>

  <!-- Panel 2: Strip Triangulation & Coplanar Merge -->
  <rect x="336" y="34" width="308" height="206" class="panel"/>
  <rect x="346" y="42" width="186" height="16" class="badge"/>
  <text x="439" y="53" text-anchor="middle" class="badge-text">2. STRIP TRIANGULATION</text>
  <text x="538" y="53" class="mono-sm">fold_strips.h</text>
  <!-- 3 triangulation modes: ridge_to_ridge, ridge_to_valley, alternate -->
  <rect x="356" y="78" width="76" height="58" class="timber-a"/>
  <line x1="356" y1="78" x2="432" y2="136" stroke="#0284c7" stroke-width="2"/>
  <text x="394" y="72" text-anchor="middle" class="mono-blue">ridge_to_ridge</text>
  <rect x="450" y="78" width="76" height="58" class="timber-b"/>
  <line x1="450" y1="136" x2="526" y2="78" stroke="#d97706" stroke-width="2"/>
  <text x="488" y="72" text-anchor="middle" class="mono-amber">ridge_to_valley</text>
  <polygon points="546,78 622,78 622,136 546,136" class="timber-c"/>
  <line x1="546" y1="78" x2="622" y2="136" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="584" y="72" text-anchor="middle" class="mono-green">merged_coplanar</text>
  <text x="348" y="162" class="mono-sm">Planar Facet Generation:</text>
  <text x="348" y="177" class="mono-sm">• Non-planar strip quads split along chosen</text>
  <text x="348" y="192" class="mono-sm">  diagonal (ridge-ridge, ridge-valley, alternate)</text>
  <text x="348" y="207" class="mono-sm">• merged_coplanar(mesh) fuses adjacent triangles</text>
  <text x="348" y="222" class="mono-sm">  with coplanar normals into single 4..6-gon faces</text>

  <!-- Panel 3: Exact Multi-Plate Node Offset -->
  <rect x="658" y="34" width="308" height="206" class="panel-hi"/>
  <rect x="668" y="42" width="186" height="16" class="badge-blue"/>
  <text x="761" y="53" text-anchor="middle" class="badge-text">3. MULTI-PLATE NODE OFFSET</text>
  <text x="860" y="53" class="mono-sm">offset_plates</text>
  <!-- Valence-6 vertex decomposed into 4 valence-3 inner vertices -->
  <circle cx="742" cy="108" r="3.5" fill="#0f172a"/>
  <line x1="742" y1="108" x2="704" y2="76" stroke="#475569" stroke-width="1.8"/>
  <line x1="742" y1="108" x2="742" y2="68" stroke="#475569" stroke-width="1.8"/>
  <line x1="742" y1="108" x2="780" y2="76" stroke="#475569" stroke-width="1.8"/>
  <line x1="742" y1="108" x2="780" y2="140" stroke="#475569" stroke-width="1.8"/>
  <line x1="742" y1="108" x2="742" y2="148" stroke="#475569" stroke-width="1.8"/>
  <line x1="742" y1="108" x2="704" y2="140" stroke="#475569" stroke-width="1.8"/>
  <text x="742" y="62" text-anchor="middle" class="mono-sm">Outer valence k=6</text>
  <line x1="788" y1="108" x2="814" y2="108" class="flow-blue"/>
  <!-- Inner split tree -->
  <line x1="854" y1="92" x2="898" y2="92" stroke="#e11d48" stroke-width="2.2"/>
  <line x1="876" y1="92" x2="876" y2="124" stroke="#e11d48" stroke-width="2.2"/>
  <circle cx="854" cy="92" r="3" fill="#e11d48"/><circle cx="898" cy="92" r="3" fill="#e11d48"/>
  <circle cx="876" cy="92" r="3" fill="#e11d48"/><circle cx="876" cy="124" r="3" fill="#e11d48"/>
  <text x="882" y="62" text-anchor="middle" class="mono-red">k-2=4 valence-3 nodes</text>
  <text x="670" y="162" class="mono-sm">offset_plates(mesh, thickness) (template_chamfer.h):</text>
  <text x="670" y="177" class="mono-sm">• Offset planes P_f by thickness along face normal</text>
  <text x="670" y="192" class="mono-sm">• Valence k &gt; 3 cycle triangulated via dynamic</text>
  <text x="670" y="207" class="mono-sm">  programming into k-2 exact 3-plane intersections</text>
  <text x="670" y="222" class="mono-sm">• Watertight planar miters with zero chamfers</text>
</svg>