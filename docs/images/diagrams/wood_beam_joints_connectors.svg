<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 295" width="100%" style="max-width:1120px;display:block;margin:14px auto;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2196ea"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e8478b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
      .halo-panel { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 11px; font-weight: 700; fill: #0f172a; letter-spacing: 0.04em; }
      .sub { font-size: 9.5px; font-weight: 500; fill: #475569; }
      .code { font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .dim { font-size: 9px; font-weight: 600; fill: #334155; }
      .badge { font-size: 9px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="295" fill="url(#grid)"/>
  <rect x="0" y="0" width="1120" height="30" fill="#111111"/>
  <text x="14" y="19" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="0.06em">[JOINTBEAM · AXIS CONTACTS, BUTT PLANES &amp; CONNECTORS]</text>
  <rect x="574" y="5" width="532" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="840" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="600">from_contact (Unit Box) · butt (4 Rules) · Face Connectors &amp; PinLayout</text>
  
  <!-- Panel 1: Axis Contact & from_contact -->
  <rect x="14" y="42" width="352" height="239" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="14" y="42" width="352" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="24" y="58" class="title">1 · AXIS CONTACT (COMPUTE_AXIS_CONTACT)</text>

  <g transform="translate(28, 76)">
    <!-- Two skew/crossing beam axes -->
    <line x1="16" y1="96" x2="160" y2="28" stroke="#2196ea" stroke-width="2.2"/>
    <line x1="20" y1="24" x2="164" y2="96" stroke="#e8478b" stroke-width="2.2"/>
    <!-- Feature bounding boxes around crossing -->
    <polygon points="62,48 116,24 126,44 72,68" fill="#dbeafe" fill-opacity="0.55" stroke="#2196ea" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="64,34 122,62 112,82 54,54" fill="#fce7f3" fill-opacity="0.55" stroke="#e8478b" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- Closest segment p0 - p1 -->
    <circle cx="90" cy="48" r="3.5" fill="#1d4ed8"/>
    <circle cx="90" cy="62" r="3.5" fill="#be185d"/>
    <line x1="90" y1="48" x2="90" y2="62" stroke="#d97706" stroke-width="2"/>
    <text x="98" y="58" class="code" fill="#b45309">contact_line</text>

    <text x="176" y="24" class="code">InteractionContactAxis</text>
    <text x="176" y="42" class="sub">• volumes[2] (8 corners)</text>
    <text x="176" y="58" class="sub">• frames[2] on axes</text>
    <text x="176" y="74" class="sub">• half_{lengths,heights,widths}</text>
    <text x="176" y="94" class="code" fill="#be185d">JointBeam::from_contact</text>
    <text x="176" y="110" class="sub">Maps any JointPlate design</text>
    <text x="176" y="124" class="sub">onto volumes[0], volumes[1]</text>
  </g>

  <rect x="26" y="218" width="328" height="52" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="234" class="code">4 Axis Families via JointBeam::from_contact:</text>
  <text x="36" y="250" class="sub">• Cross (half-laps, Brussels)  • End-to-end (splayed scarf)</text>
  <text x="36" y="264" class="sub">• Corner (miter tenons/fingers) • Top-side (tenon-mortise)</text>

  <!-- Panel 2: Butt Classification -->
  <rect x="378" y="42" width="352" height="239" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="378" y="42" width="352" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="388" y="58" class="title">2 · AUTOMATIC BUTT JOINTS (JOINTBEAM::BUTT)</text>

  <!-- 2x2 grid of butt cases -->
  <g transform="translate(390, 74)">
    <rect width="158" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">top_side (T-butt)</text>
    <rect x="16" y="54" width="84" height="18" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="48" y="22" width="20" height="32" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <line x1="44" y1="54" x2="72" y2="54" stroke="#dc2626" stroke-width="2"/>
    <text x="8" y="84" class="sub">Cut flush on side face</text>
  </g>

  <g transform="translate(558, 74)">
    <rect width="160" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">side_side_outplane</text>
    <polygon points="18,68 58,68 42,52 18,52" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <polygon points="58,68 58,26 42,26 42,52" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <line x1="38" y1="48" x2="62" y2="72" stroke="#dc2626" stroke-width="2"/>
    <text x="8" y="84" class="sub">Bisector miter plane</text>
  </g>

  <g transform="translate(390, 176)">
    <rect width="158" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">side_side_inplane</text>
    <rect x="16" y="42" width="42" height="18" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="58" y="42" width="42" height="18" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <line x1="58" y1="36" x2="58" y2="66" stroke="#dc2626" stroke-width="2"/>
    <text x="8" y="84" class="sub">Collinear splice plane</text>
  </g>

  <g transform="translate(558, 176)">
    <rect width="160" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">cross (Half-lap)</text>
    <rect x="16" y="44" width="76" height="16" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="44" y="24" width="20" height="52" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <rect x="44" y="44" width="20" height="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
    <text x="8" y="84" class="sub">4-plane step to mid-depth</text>
  </g>

  <!-- Panel 3: Face-Contact Connectors & Pins -->
  <rect x="742" y="42" width="364" height="239" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="742" y="42" width="364" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="752" y="58" class="title">3 · FACE-CONTACT CONNECTORS &amp; PIN LAYOUTS</text>

  <!-- Wedge -->
  <g transform="translate(754, 74)">
    <rect width="164" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">wedge(a, b, contact)</text>
    <rect x="16" y="30" width="32" height="38" fill="#dbeafe" stroke="#2196ea"/>
    <rect x="48" y="30" width="32" height="38" fill="#e0f2fe" stroke="#0284c7"/>
    <polygon points="34,30 62,30 48,58" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
    <line x1="22" y1="42" x2="74" y2="42" stroke="#e8478b" stroke-width="2"/>
    <text x="86" y="40" class="sub">Block child</text>
    <text x="86" y="54" class="sub">+ 2 pockets</text>
    <text x="86" y="68" class="sub">+ flush pins</text>
    <text x="8" y="84" class="dim">Seam &amp; oculus beams</text>
  </g>

  <!-- Rectangle plate & butterfly key -->
  <g transform="translate(928, 74)">
    <rect width="166" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">rectangle_plate / key</text>
    <rect x="14" y="34" width="30" height="34" fill="#dbeafe" stroke="#2196ea"/>
    <rect x="44" y="34" width="30" height="34" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="24" y="40" width="40" height="20" fill="#fce7f3" stroke="#e8478b" stroke-width="1.4"/>
    <circle cx="30" cy="45" r="2" fill="#be185d"/>
    <circle cx="30" cy="55" r="2" fill="#be185d"/>
    <circle cx="58" cy="45" r="2" fill="#be185d"/>
    <circle cx="58" cy="55" r="2" fill="#be185d"/>
    <text x="80" y="40" class="sub">let_in_plate</text>
    <text x="80" y="54" class="sub">4 corner pins</text>
    <text x="80" y="68" class="sub">butterfly_key</text>
    <text x="8" y="84" class="dim">Column-to-rib &amp; miters</text>
  </g>

  <!-- PinLayout row -->
  <g transform="translate(754, 176)">
    <rect width="340" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#059669">centred_pins &amp; headed_pins (PinLayout)</text>
    <!-- 3 contact boxes showing corners, vertical, horizontal -->
    <rect x="16" y="28" width="42" height="42" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="22" y="34" width="30" height="30" fill="none" stroke="#cbd5e1" stroke-dasharray="2,2"/>
    <circle cx="22" cy="34" r="2.5" fill="#e8478b"/><circle cx="52" cy="34" r="2.5" fill="#e8478b"/>
    <circle cx="22" cy="64" r="2.5" fill="#e8478b"/><circle cx="52" cy="64" r="2.5" fill="#e8478b"/>
    <text x="37" y="84" text-anchor="middle" class="dim">corners</text>

    <rect x="74" y="28" width="42" height="42" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="95" cy="36" r="2.5" fill="#2196ea"/><circle cx="95" cy="49" r="2.5" fill="#2196ea"/><circle cx="95" cy="62" r="2.5" fill="#2196ea"/>
    <text x="95" y="84" text-anchor="middle" class="dim">vertical</text>

    <rect x="132" y="28" width="42" height="42" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="140" cy="49" r="2.5" fill="#059669"/><circle cx="153" cy="49" r="2.5" fill="#059669"/><circle cx="166" cy="49" r="2.5" fill="#059669"/>
    <text x="153" y="84" text-anchor="middle" class="dim">horizontal</text>

    <text x="188" y="38" class="sub">• inset: border margin (20 mm)</text>
    <text x="188" y="54" class="sub">• shift: offset along X (15 mm)</text>
    <text x="188" y="70" class="sub">• Pin children + Ø2r bores</text>
  </g>
  
</svg>
