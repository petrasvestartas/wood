<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="265" class="bg"/>
  <text x="16" y="22" class="title">CHEVRON SHELL — PRIMARY INPUTS &amp; 6-STEP BOX-PLATE &amp; JOINERY PIPELINE (Chevron)</text>

  <!-- Step 1: Primary Input Surface & Row Parameters -->
  <rect x="14" y="34" width="225" height="216" class="panel-warm"/>
  <rect x="24" y="42" width="136" height="16" class="badge-amber"/>
  <text x="92" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="166" y="53" class="mono-sm">surface</text>
  <path d="M 34,132 Q 115,72 215,126 L 195,152 Q 115,98 34,152 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 75,112 L 95,98 L 115,110" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 115,110 L 135,96 L 155,108" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="84" text-anchor="middle" class="mono-amber">NurbsSurface (u, v)</text>
  <text x="26" y="170" class="mono-sm">• surface: NurbsSurface (Annen)</text>
  <text x="26" y="184" class="mono-sm">• u_divisions = 4, v_dist = 900</text>
  <text x="26" y="198" class="mono-sm">• shift = 0.5, scale = 0.05799</text>
  <text x="26" y="212" class="mono-sm">• box_height = 760, inlet = 80</text>
  <text x="26" y="226" class="mono-sm">• plate_thickness = 40 mm</text>
  <text x="26" y="240" class="small">• edge_rotation = 1°, offset = 0.5t</text>

  <line x1="239" y1="142" x2="255" y2="142" class="flow-arrow"/>

  <!-- Step 2: Chevron Mesh & Strips -->
  <rect x="257" y="34" width="225" height="216" class="panel"/>
  <rect x="267" y="42" width="136" height="16" class="badge"/>
  <text x="335" y="53" text-anchor="middle" class="badge-text">2. MESH &amp; STRIPS</text>
  <text x="410" y="53" class="mono-sm">mesh/strips</text>
  <!-- Herringbone quads + highlighted chevron edges -->
  <polygon points="278,138 320,112 320,84 278,110" class="timber-a"/>
  <polygon points="320,112 362,138 362,110 320,84" class="timber-b"/>
  <polygon points="362,138 404,112 404,84 362,110" class="timber-a"/>
  <polygon points="404,112 446,138 446,110 404,84" class="timber-b"/>
  <!-- Red chevron edges -->
  <polyline points="278,110 320,84 362,110 404,84 446,110" fill="none" stroke="#e11d48" stroke-width="2.4"/>
  <text x="362" y="76" text-anchor="middle" class="mono-red">chevron_edges: {3,0} / {0,1}</text>
  <text x="269" y="170" class="mono-sm">1. chevron_row(u, v_side, v_mid):</text>
  <text x="269" y="184" class="mono-sm">   rows grow by scale to mid-v,</text>
  <text x="269" y="198" class="mono-sm">   then mirror to opposite end</text>
  <text x="269" y="212" class="mono-sm">2. compute_strips(): grow along v;</text>
  <text x="269" y="226" class="mono-sm">   alternate strip flip = (s%2==0)</text>
  <text x="269" y="240" class="small">Groups: "mesh", "strips"</text>

  <line x1="482" y1="142" x2="498" y2="142" class="flow-arrow"/>

  <!-- Step 3: Turned Edge Planes & Bisectors -->
  <rect x="500" y="34" width="225" height="216" class="panel"/>
  <rect x="510" y="42" width="144" height="16" class="badge"/>
  <text x="582" y="53" text-anchor="middle" class="badge-text">3. PLANES &amp; BISECTORS</text>
  <text x="660" y="53" class="mono-sm">bisectors</text>
  <!-- Quad with edge planes and corner bisectors -->
  <polygon points="535,140 585,82 675,95 625,152" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <line x1="585" y1="82" x2="604" y2="112" stroke="#e11d48" stroke-width="2"/>
  <line x1="675" y1="95" x2="642" y2="118" stroke="#e11d48" stroke-width="2"/>
  <line x1="535" y1="140" x2="568" y2="126" stroke="#0284c7" stroke-width="2"/>
  <line x1="625" y1="152" x2="604" y2="132" stroke="#0284c7" stroke-width="2"/>
  <text x="608" y="75" text-anchor="middle" class="mono-red">dihedral_plane(p1, p0)</text>
  <text x="512" y="170" class="mono-sm">• Even chevron edge: rotate ±1°</text>
  <text x="512" y="184" class="mono-sm">  around edge y-axis</text>
  <text x="512" y="198" class="mono-sm">• Odd chevron edge: translate</text>
  <text x="512" y="212" class="mono-sm">  by normal (t × edge_offset)</text>
  <text x="512" y="226" class="mono-sm">• Boundary: snapped_to_axis</text>
  <text x="512" y="240" class="small">Groups: "edge_planes", "bisectors"</text>

  <line x1="725" y1="142" x2="741" y2="142" class="flow-arrow"/>

  <!-- Step 4: 4-Plate Box & Insertion Joinery -->
  <rect x="743" y="34" width="223" height="216" class="panel-hi"/>
  <rect x="753" y="42" width="146" height="16" class="badge-blue"/>
  <text x="826" y="53" text-anchor="middle" class="badge-text">4. 4-PLATE BOX &amp; JOINTS</text>
  <text x="905" y="53" class="mono-sm">plates</text>
  <!-- Cross section of 760 mm box with inset top/bottom plates and side plates -->
  <rect x="768" y="78" width="14" height="72" class="timber-b"/>
  <rect x="918" y="78" width="14" height="72" class="timber-b"/>
  <rect x="782" y="88" width="136" height="12" class="timber-a"/>
  <rect x="782" y="128" width="136" height="12" class="timber-a"/>
  <line x1="850" y1="146" x2="850" y2="72" class="flow-red"/>
  <text x="850" y="70" text-anchor="middle" class="mono-red">insertion vector</text>
  <text x="850" y="117" text-anchor="middle" class="mono-blue">box_height = 760, inlet = 80</text>
  <text x="755" y="170" class="mono-sm">Per face (4 plates = plate_4f+r):</text>
  <text x="755" y="184" class="mono-sm">• r=0,1: top/bottom (mortise 20)</text>
  <text x="755" y="198" class="mono-sm">• r=2,3: 2 chevron sides (tenon 10)</text>
  <text x="755" y="212" class="mono-sm">• insertion_vectors (18 doubles)</text>
  <text x="755" y="226" class="mono-sm">• three_valence &amp; adjacency</text>
  <text x="755" y="240" class="small">Groups: "plates", "insertion"</text>
</svg>