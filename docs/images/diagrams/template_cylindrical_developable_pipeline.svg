<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="260" class="bg"/>
  <text x="16" y="22" class="title">CYLINDRICAL &amp; DEVELOPABLE FOLDING — PRIMARY INPUTS, RULINGS &amp; 6-PATCH PlateCurved SOLIDS</text>

  <!-- Panel 1: Primary Inputs -->
  <rect x="14" y="34" width="308" height="212" class="panel-warm"/>
  <rect x="24" y="42" width="154" height="16" class="badge-amber"/>
  <text x="101" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="186" y="53" class="mono-sm">curves &amp; planes</text>
  <!-- NURBS profile arc + ruling vector + fold planes -->
  <path d="M 36,134 Q 82,74 128,134" fill="none" stroke="#0284c7" stroke-width="2.6"/>
  <line x1="82" y1="104" x2="152" y2="104" class="flow-blue"/>
  <line x1="162" y1="72" x2="138" y2="144" stroke="#e11d48" stroke-width="2.2"/>
  <line x1="218" y1="72" x2="242" y2="144" stroke="#e11d48" stroke-width="2.2"/>
  <circle cx="276" cy="108" r="24" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="82" y="72" text-anchor="middle" class="mono-blue">NurbsCurve arc</text>
  <text x="190" y="68" text-anchor="middle" class="mono-red">Fold planes</text>
  <text x="276" y="72" text-anchor="middle" class="mono-green">Carver</text>
  <text x="26" y="164" class="mono-sm">• ReflectionFold: profile arcs, along, Folds{s, α}</text>
  <text x="26" y="179" class="mono-sm">• CylinderVault: span, rise, sides (3..8), Kind</text>
  <text x="26" y="194" class="mono-sm">• CylinderCarving: Blank + vector&lt;Carver&gt; cylinders</text>
  <text x="26" y="209" class="mono-sm">• CurvedCreaseUnfolding: arc/catenary, α, planes</text>
  <text x="26" y="224" class="mono-sm">  (zigzag, leaning, fan) + thickness</text>

  <!-- Panel 2: Affine Ruling Projection & Curved Creases -->
  <rect x="336" y="34" width="308" height="212" class="panel"/>
  <rect x="346" y="42" width="186" height="16" class="badge"/>
  <text x="439" y="53" text-anchor="middle" class="badge-text">2. RULING &amp; CREASE LAW</text>
  <text x="538" y="53" class="mono-sm">creases / inners</text>
  <!-- Cylindrical reflection across oblique plane + curved crease kappa_3D -->
  <path d="M 358,118 Q 395,78 432,118" fill="none" stroke="#0284c7" stroke-width="2.2"/>
  <line x1="452" y1="72" x2="424" y2="146" stroke="#e11d48" stroke-width="2.2"/>
  <path d="M 438,108 Q 475,142 512,108" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <!-- Rulings -->
  <line x1="395" y1="98" x2="438" y2="108" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2"/>
  <line x1="438" y1="108" x2="482" y2="125" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,2"/>
  <!-- Quadrant Q1..Q4 diagram -->
  <line x1="576" y1="76" x2="576" y2="142" stroke="#e11d48" stroke-width="2"/>
  <line x1="576" y1="108" x2="544" y2="84" class="flow-blue"/>
  <line x1="576" y1="108" x2="612" y2="84" class="flow-blue"/>
  <line x1="576" y1="108" x2="612" y2="132" class="flow-arrow"/>
  <text x="436" y="68" text-anchor="middle" class="mono-blue">Affine ellipse crease</text>
  <text x="578" y="68" text-anchor="middle" class="mono-red">κ_3D = κ_2D / cos α</text>
  <text x="348" y="164" class="mono-sm">Exact Developable Crease Kinematics:</text>
  <text x="348" y="179" class="mono-sm">• Cylindrical: affine projection of rational NURBS</text>
  <text x="348" y="194" class="mono-sm">  arcs along rulings onto fold planes (weights exact)</text>
  <text x="348" y="209" class="mono-sm">• Developable: rulings ⊥ crease rotated by ±α</text>
  <text x="348" y="224" class="mono-sm">• Inner offset curves projected to shared miter seam</text>

  <!-- Panel 3: 6-Patch PlateCurved & Flat Development -->
  <rect x="658" y="34" width="308" height="212" class="panel-hi"/>
  <rect x="668" y="42" width="196" height="16" class="badge-blue"/>
  <text x="766" y="53" text-anchor="middle" class="badge-text">3. PlateCurved &amp; DEVELOPMENT</text>
  <text x="870" y="53" class="mono-sm">lamellas / flat</text>
  <!-- 3D curved lamella + 2D unfolded flat strip -->
  <path d="M 678,128 Q 726,76 774,128 L 766,142 Q 726,94 686,142 Z" class="timber-a"/>
  <line x1="786" y1="112" x2="812" y2="112" class="flow-blue"/>
  <!-- 2D unfolded pattern in XY -->
  <polygon points="822,86 942,82 936,136 828,132" class="timber-c"/>
  <line x1="852" y1="85" x2="856" y2="133" class="guide-line"/>
  <line x1="882" y1="84" x2="886" y2="134" class="guide-line"/>
  <line x1="912" y1="83" x2="916" y2="135" class="guide-line"/>
  <text x="726" y="72" text-anchor="middle" class="mono-blue">PlateCurved (6 NURBS)</text>
  <text x="882" y="72" text-anchor="middle" class="mono-green">Development (XY flat)</text>
  <text x="670" y="164" class="mono-sm">PlateCurved(outer_a, outer_b, inner_a, inner_b):</text>
  <text x="670" y="179" class="mono-sm">• 6 ruled NURBS patches (outer, inner, 2 miter</text>
  <text x="670" y="194" class="mono-sm">  creases, 2 side walls) → exact BRep</text>
  <text x="670" y="209" class="mono-sm">• Development(outer_a, outer_b, 32): unfolds strip</text>
  <text x="670" y="224" class="mono-sm">  to XY &amp; verifies diagonal distortion &lt; 1e-14</text>
</svg>