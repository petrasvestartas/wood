<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 255" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="255" class="bg"/>
  <text x="16" y="22" class="title">TRANSLATION SHELL — PRIMARY INPUTS &amp; 4-STEP GEOMETRY GENERATION PIPELINE (TranslationShell)</text>

  <!-- Step 1: Primary Inputs -->
  <rect x="14" y="34" width="225" height="206" class="panel-warm"/>
  <rect x="24" y="42" width="136" height="16" class="badge-amber"/>
  <text x="92" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="168" y="53" class="mono-sm">curves</text>
  <!-- XZ cross_section arch + YZ profile arch -->
  <line x1="40" y1="145" x2="210" y2="145" class="guide-line"/>
  <line x1="115" y1="70" x2="115" y2="155" class="guide-line"/>
  <!-- cross_section in XZ (blue) -->
  <path d="M 45,140 Q 80,82 115,140" fill="none" stroke="#0284c7" stroke-width="2.4"/>
  <circle cx="45" cy="140" r="2.5" fill="#0284c7"/><circle cx="62" cy="115" r="2.5" fill="#0284c7"/>
  <circle cx="80" cy="96" r="2.5" fill="#0284c7"/><circle cx="98" cy="115" r="2.5" fill="#0284c7"/>
  <circle cx="115" cy="140" r="2.5" fill="#0284c7"/>
  <text x="80" y="84" text-anchor="middle" class="mono-blue">cross_section (XZ)</text>
  <!-- profile in YZ (red) -->
  <path d="M 115,140 Q 162,78 210,122" fill="none" stroke="#e11d48" stroke-width="2.4"/>
  <circle cx="115" cy="140" r="2.5" fill="#e11d48"/><circle cx="139" cy="112" r="2.5" fill="#e11d48"/>
  <circle cx="163" cy="96" r="2.5" fill="#e11d48"/><circle cx="187" cy="104" r="2.5" fill="#e11d48"/>
  <circle cx="210" cy="122" r="2.5" fill="#e11d48"/>
  <text x="168" y="84" text-anchor="middle" class="mono-red">profile (YZ)</text>
  <text x="26" y="172" class="mono-sm">• cross_section: Polyline (N_c pts)</text>
  <text x="26" y="187" class="mono-sm">• profile: Polyline (N_p pts)</text>
  <text x="26" y="202" class="mono-sm">• thickness = 10.0 mm</text>
  <text x="26" y="217" class="mono-sm">• chamfer = 1.0, angle = 180°</text>
  <text x="26" y="231" class="small">Group: add_group("curves")</text>

  <line x1="239" y1="137" x2="255" y2="137" class="flow-arrow"/>

  <!-- Step 2: Translated Sections -->
  <rect x="257" y="34" width="225" height="206" class="panel"/>
  <rect x="267" y="42" width="144" height="16" class="badge"/>
  <text x="339" y="53" text-anchor="middle" class="badge-text">2. SWEPT SECTIONS</text>
  <text x="418" y="53" class="mono-sm">sections</text>
  <!-- Parallel translated arches -->
  <path d="M 278,148 Q 313,94 348,148" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 300,136 Q 335,82 370,136" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-opacity="0.8"/>
  <path d="M 322,126 Q 357,72 392,126" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-opacity="0.8"/>
  <path d="M 344,122 Q 379,68 414,122" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-opacity="0.8"/>
  <path d="M 366,126 Q 401,72 436,126" fill="none" stroke="#0284c7" stroke-width="2"/>
  <path d="M 278,148 Q 322,120 366,126" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="278" y1="148" x2="320" y2="127" class="flow-red"/>
  <text x="398" y="148" class="mono-red">Δ_i = P[i] - P[0]</text>
  <text x="269" y="172" class="mono-sm">compute_sections():</text>
  <text x="269" y="187" class="mono-sm">step = profile[i] - profile[0]</text>
  <text x="269" y="202" class="mono-sm">S_i = cross_section.translated(step)</text>
  <text x="269" y="217" class="mono-sm">→ N_p translated polylines</text>
  <text x="269" y="231" class="small">Group: add_group("sections")</text>

  <line x1="482" y1="137" x2="498" y2="137" class="flow-arrow"/>

  <!-- Step 3: Quad Mesh -->
  <rect x="500" y="34" width="225" height="206" class="panel"/>
  <rect x="510" y="42" width="122" height="16" class="badge"/>
  <text x="571" y="53" text-anchor="middle" class="badge-text">3. QUAD MESH</text>
  <text x="640" y="53" class="mono-sm">mesh</text>
  <!-- Planar quads grid -->
  <polygon points="525,145 552,115 582,103 555,133" class="timber-a"/>
  <polygon points="552,115 582,95 612,83 582,103" class="timber-b"/>
  <polygon points="582,95 612,108 642,96 612,83" class="timber-a"/>
  <polygon points="555,133 582,103 612,95 585,125" class="timber-b"/>
  <polygon points="582,103 612,83 642,75 612,95" class="timber-a"/>
  <polygon points="612,83 642,96 672,88 642,75" class="timber-b"/>
  <text x="610" y="148" text-anchor="middle" class="mono-blue">Planar translational quads</text>
  <text x="512" y="172" class="mono-sm">compute_mesh(sections):</text>
  <text x="512" y="187" class="mono-sm">face = {row, prev, prev+1, row+1}</text>
  <text x="512" y="202" class="mono-sm">(N_p-1)×(N_c-1) exact planar</text>
  <text x="512" y="217" class="mono-sm">translational parallelogram quads</text>
  <text x="512" y="231" class="small">Group: add_group("mesh")</text>

  <line x1="725" y1="137" x2="741" y2="137" class="flow-arrow"/>

  <!-- Step 4: Mitered & Chamfered Plates -->
  <rect x="743" y="34" width="223" height="206" class="panel-hi"/>
  <rect x="753" y="42" width="142" height="16" class="badge-blue"/>
  <text x="824" y="53" text-anchor="middle" class="badge-text">4. MITERED PLATES</text>
  <text x="903" y="53" class="mono-sm">plates</text>
  <!-- Cross-section of 2 mitered plates + corner chamfer -->
  <polygon points="762,132 835,95 841,112 770,148" class="timber-a"/>
  <polygon points="835,95 918,128 910,144 841,112" class="timber-b"/>
  <line x1="831" y1="78" x2="845" y2="128" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="3,2"/>
  <text x="838" y="73" text-anchor="middle" class="mono-red">Dihedral miter</text>
  <!-- Chamfer detail callout -->
  <polygon points="922,82 954,82 954,108 932,108 922,98" class="timber-c"/>
  <line x1="922" y1="98" x2="932" y2="108" stroke="#e11d48" stroke-width="2"/>
  <text x="938" y="76" text-anchor="middle" class="mono-green">chamfer</text>
  <text x="755" y="172" class="mono-sm">mitered_plates(mesh, t, c, c, α):</text>
  <text x="755" y="187" class="mono-sm">1. Mesh::miter_contours(±t/2)</text>
  <text x="755" y="202" class="mono-sm">2. chamfer_contours(chamfer, α)</text>
  <text x="755" y="217" class="mono-sm">3. Plate(bottom, top, "plate_i")</text>
  <text x="755" y="231" class="small">Group: add_group("plates") — 110 plates</text>
</svg>