<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="260" class="bg"/>
  <text x="16" y="22" class="title">TIMBER TRUSS — PRIMARY INPUTS, BOUNDARY-PEELING RANK &amp; NODE BUTTS (wood_truss::Truss)</text>

  <!-- Step 1: Primary Input TrussGuide -->
  <rect x="14" y="34" width="225" height="212" class="panel-warm"/>
  <rect x="24" y="42" width="136" height="16" class="badge-amber"/>
  <text x="92" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="166" y="53" class="mono-sm">TrussGuide</text>
  <!-- Wireframe Pratt truss: chords (polylines) + webs (lines) -->
  <polyline points="34,138 126,78 218,138" fill="none" stroke="#0284c7" stroke-width="2.6"/>
  <line x1="34" y1="138" x2="218" y2="138" stroke="#0284c7" stroke-width="2.6"/>
  <line x1="65" y1="118" x2="65" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="95" y1="98" x2="95" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="126" y1="78" x2="126" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="157" y1="98" x2="157" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="187" y1="118" x2="187" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="65" y1="118" x2="95" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="95" y1="98" x2="126" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="157" y1="98" x2="126" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <line x1="187" y1="118" x2="157" y2="138" stroke="#e11d48" stroke-width="1.8"/>
  <text x="126" y="72" text-anchor="middle" class="mono-blue">chords (Polylines)</text>
  <text x="126" y="154" text-anchor="middle" class="mono-red">webs &amp; posts (Lines)</text>
  <text x="26" y="172" class="mono-sm">• chords: vector&lt;Polyline&gt;</text>
  <text x="26" y="186" class="mono-sm">• webs: vector&lt;Line&gt;</text>
  <text x="26" y="200" class="mono-sm">• posts: vector&lt;Line&gt;</text>
  <text x="26" y="214" class="mono-sm">• chord_radius = 80, web_radius = 60</text>
  <text x="26" y="228" class="small">• 80 built-in TrussGuide::* presets</text>

  <line x1="239" y1="140" x2="255" y2="140" class="flow-arrow"/>

  <!-- Step 2: Boundary-Peeling Graph Rank -->
  <rect x="257" y="34" width="225" height="212" class="panel"/>
  <rect x="267" y="42" width="144" height="16" class="badge"/>
  <text x="339" y="53" text-anchor="middle" class="badge-text">2. BOUNDARY RANK</text>
  <text x="418" y="53" class="mono-sm">peeling</text>
  <!-- Rank 0 outer boundary vs Rank 1 inner webs -->
  <polygon points="278,138 370,76 462,138" fill="none" stroke="#0284c7" stroke-width="4"/>
  <line x1="324" y1="107" x2="324" y2="138" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3,2"/>
  <line x1="370" y1="76" x2="370" y2="138" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3,2"/>
  <line x1="416" y1="107" x2="416" y2="138" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3,2"/>
  <line x1="324" y1="107" x2="370" y2="138" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3,2"/>
  <line x1="416" y1="107" x2="370" y2="138" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3,2"/>
  <text x="370" y="69" text-anchor="middle" class="mono-blue">Rank 0: outer boundary</text>
  <text x="370" y="154" text-anchor="middle" class="mono-amber">Rank 1..k: inner webs</text>
  <text x="269" y="172" class="mono-sm">Iterative Graph Boundary Peeling:</text>
  <text x="269" y="186" class="mono-sm">1. Outer perimeter chords &amp; posts</text>
  <text x="269" y="200" class="mono-sm">   assigned rank 0 (cut first)</text>
  <text x="269" y="214" class="mono-sm">2. Remaining inner webs peeled</text>
  <text x="269" y="228" class="mono-sm">   layer by layer (let into rank 0)</text>

  <line x1="482" y1="140" x2="498" y2="140" class="flow-arrow"/>

  <!-- Step 3: Chord Kinks, Heels & Cross Laps -->
  <rect x="500" y="34" width="225" height="212" class="panel"/>
  <rect x="510" y="42" width="144" height="16" class="badge"/>
  <text x="582" y="53" text-anchor="middle" class="badge-text">3. CHORD &amp; LAP BUTTS</text>
  <text x="660" y="53" class="mono-sm">chords</text>
  <!-- Ridge kink miter + heel butt + cross half-lap -->
  <polygon points="520,122 572,82 572,98 528,132" class="timber-a"/>
  <polygon points="572,82 624,122 616,132 572,98" class="timber-b"/>
  <line x1="572" y1="78" x2="572" y2="104" stroke="#e11d48" stroke-width="2.2"/>
  <text x="572" y="73" text-anchor="middle" class="mono-red">Kink Miter</text>
  <!-- Cross lap X -->
  <line x1="646" y1="84" x2="702" y2="134" stroke="#0284c7" stroke-width="6"/>
  <line x1="646" y1="134" x2="702" y2="84" stroke="#d97706" stroke-width="6"/>
  <circle cx="674" cy="109" r="6" class="cut-zone"/>
  <text x="674" y="75" text-anchor="middle" class="mono-amber">butt_cross</text>
  <text x="512" y="172" class="mono-sm">add_chord_butts() &amp; crossings:</text>
  <text x="512" y="186" class="mono-sm">• Kink: side_side on angle bisector</text>
  <text x="512" y="200" class="mono-sm">• Heel: JointBeam::butt</text>
  <text x="512" y="214" class="mono-sm">• Crossing webs/chords: butt_cross</text>
  <text x="512" y="228" class="mono-sm">  (depth divided across N members)</text>

  <line x1="725" y1="140" x2="741" y2="140" class="flow-arrow"/>

  <!-- Step 4: Web & Post Node Resolution -->
  <rect x="743" y="34" width="223" height="212" class="panel-hi"/>
  <rect x="753" y="42" width="144" height="16" class="badge-blue"/>
  <text x="825" y="53" text-anchor="middle" class="badge-text">4. WEB NODE BUTTS</text>
  <text x="903" y="53" class="mono-sm">webs</text>
  <!-- Bottom chord running through; vertical + 2 diagonals let into chord & mitered together -->
  <rect x="762" y="128" width="184" height="18" class="timber-a"/>
  <polygon points="846,74 862,74 862,128 846,128" class="timber-b"/>
  <polygon points="784,82 798,74 846,118 846,128 832,128" class="timber-c"/>
  <polygon points="924,82 910,74 862,118 862,128 876,128" class="timber-c"/>
  <line x1="830" y1="128" x2="878" y2="128" stroke="#e11d48" stroke-width="2.5"/>
  <line x1="846" y1="114" x2="846" y2="128" stroke="#e11d48" stroke-width="2.2"/>
  <line x1="862" y1="114" x2="862" y2="128" stroke="#e11d48" stroke-width="2.2"/>
  <text x="854" y="69" text-anchor="middle" class="mono-red">top_side on chord + side_side miter</text>
  <text x="755" y="172" class="mono-sm">add_web_butts():</text>
  <text x="755" y="186" class="mono-sm">• Inner web let into outer chord</text>
  <text x="755" y="200" class="mono-sm">  (loses only wood chord actually has)</text>
  <text x="755" y="214" class="mono-sm">• Same-rank webs sharing a node</text>
  <text x="755" y="228" class="mono-sm">  mitered side_side with neighbours</text>
</svg>