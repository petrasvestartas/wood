<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="265" class="bg"/>
  <text x="16" y="22" class="title">TIMBER MODULES — PRIMARY INPUTS &amp; GEOMETRY GENERATION (Wall · CassetteShell · RoomModule)</text>

  <!-- Panel 1: Wall & FramedPanel -->
  <rect x="14" y="34" width="308" height="216" class="panel-warm"/>
  <rect x="24" y="42" width="178" height="16" class="badge-amber"/>
  <text x="113" y="53" text-anchor="middle" class="badge-text">1. FRAMED WALL (WallGuide)</text>
  <text x="210" y="53" class="mono-sm">Wall / FramedPanel</text>
  <!-- Wall frame elevation with door notch and window hole -->
  <rect x="32" y="68" width="270" height="82" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <!-- Top & bottom rails -->
  <rect x="32" y="68" width="270" height="6" class="timber-b"/>
  <rect x="32" y="144" width="42" height="6" class="timber-b"/>
  <rect x="118" y="144" width="184" height="6" class="timber-b"/>
  <!-- Door opening (left) -->
  <rect x="74" y="88" width="44" height="62" class="cut-zone"/>
  <text x="96" y="122" text-anchor="middle" class="mono-red">Door</text>
  <!-- Window opening (right) -->
  <rect x="184" y="88" width="68" height="36" class="cut-zone"/>
  <text x="218" y="110" text-anchor="middle" class="mono-red">Window</text>
  <!-- Studs & jambs & header/sill -->
  <line x1="54" y1="74" x2="54" y2="144" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="74" y1="74" x2="74" y2="144" stroke="#d97706" stroke-width="3"/>
  <line x1="118" y1="74" x2="118" y2="144" stroke="#d97706" stroke-width="3"/>
  <line x1="74" y1="86" x2="118" y2="86" stroke="#16a34a" stroke-width="3"/>
  <line x1="142" y1="74" x2="142" y2="144" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="164" y1="74" x2="164" y2="144" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="184" y1="74" x2="184" y2="144" stroke="#d97706" stroke-width="3"/>
  <line x1="252" y1="74" x2="252" y2="144" stroke="#d97706" stroke-width="3"/>
  <line x1="184" y1="86" x2="252" y2="86" stroke="#16a34a" stroke-width="3"/>
  <line x1="184" y1="126" x2="252" y2="126" stroke="#16a34a" stroke-width="3"/>
  <line x1="278" y1="74" x2="278" y2="144" stroke="#0284c7" stroke-width="2.5"/>
  <text x="26" y="168" class="mono-sm">Primary Input: WallGuide(length, height, openings)</text>
  <text x="26" y="182" class="mono-sm">• Opening{x, width, sill, head} (sill=0 → door)</text>
  <text x="26" y="196" class="mono-sm">• Grid studs at stud_spacing (625 mm); omits any</text>
  <text x="26" y="210" class="mono-sm">  grid stud closer than 0.5×spacing to a jamb</text>
  <text x="26" y="224" class="mono-sm">• Sheathing Plates (15 mm) notched/punched</text>
  <text x="26" y="238" class="small">• add_module_contacts → 26 frame + 32 sheet contacts</text>

  <!-- Panel 2: CassetteShell & CassetteHouse -->
  <rect x="336" y="34" width="308" height="216" class="panel"/>
  <rect x="346" y="42" width="186" height="16" class="badge"/>
  <text x="439" y="53" text-anchor="middle" class="badge-text">2. CASSETTE SHELL (Mesh+Ranks)</text>
  <text x="538" y="53" class="mono-sm">CassetteShell</text>
  <!-- Left: Bevel miter (ranks empty); Right: Ranked T-joint (house_ranks) -->
  <polygon points="354,126 420,96 424,116 362,144" class="timber-a"/>
  <polygon points="420,96 484,126 476,144 424,116" class="timber-b"/>
  <line x1="418" y1="84" x2="426" y2="128" stroke="#e11d48" stroke-width="2"/>
  <text x="420" y="78" text-anchor="middle" class="mono-red">ranks={}: Bevel</text>
  <!-- Ranked T-joint at eave -->
  <polygon points="512,112 618,78 624,96 518,130" class="timber-a"/>
  <rect x="588" y="94" width="22" height="52" class="timber-b"/>
  <line x1="588" y1="94" x2="610" y2="87" stroke="#e11d48" stroke-width="2.4"/>
  <text x="572" y="78" text-anchor="middle" class="mono-blue">ranks: Roof T-joint</text>
  <text x="348" y="168" class="mono-sm">Primary Input: Mesh + depth + beam_width + ranks</text>
  <text x="348" y="182" class="mono-sm">• Each face → top/bottom Plate + perimeter</text>
  <text x="348" y="196" class="mono-sm">  beams lofted between offset face planes</text>
  <text x="348" y="210" class="mono-sm">• ranks empty → mean-normal bevel edge planes</text>
  <text x="348" y="224" class="mono-sm">• house_ranks → lower rank runs through (T-joint)</text>
  <text x="348" y="238" class="small">• Verifies inter-cassette face contacts on every seam</text>

  <!-- Panel 3: RoomModule -->
  <rect x="658" y="34" width="308" height="216" class="panel-hi"/>
  <rect x="668" y="42" width="196" height="16" class="badge-blue"/>
  <text x="766" y="53" text-anchor="middle" class="badge-text">3. ROOM MODULE (RoomModuleGuide)</text>
  <text x="870" y="53" class="mono-sm">RoomModule</text>
  <!-- End cross-section of 2 side-by-side modules forming 1 open room -->
  <rect x="684" y="76" width="124" height="10" class="timber-a"/>
  <rect x="812" y="76" width="124" height="10" class="timber-a"/>
  <!-- Deep downstand ceiling edge beams (190x470) -->
  <rect x="684" y="76" width="14" height="22" class="timber-b"/>
  <rect x="794" y="76" width="14" height="22" class="timber-b"/>
  <rect x="812" y="76" width="14" height="22" class="timber-b"/>
  <rect x="922" y="76" width="14" height="22" class="timber-b"/>
  <!-- Outer walls & open interior posts -->
  <rect x="684" y="98" width="14" height="36" class="timber-c"/>
  <rect x="922" y="98" width="14" height="36" class="timber-c"/>
  <rect x="794" y="98" width="14" height="36" fill="none" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <rect x="812" y="98" width="14" height="36" fill="none" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <text x="810" y="118" text-anchor="middle" class="mono-red">Open seam (mid-post)</text>
  <!-- Floor cassettes (280 mm) -->
  <rect x="684" y="134" width="124" height="14" class="timber-a"/>
  <rect x="812" y="134" width="124" height="14" class="timber-a"/>
  <text x="670" y="168" class="mono-sm">Primary Input: RoomModuleGuide (9000×3000×2700)</text>
  <text x="670" y="182" class="mono-sm">• Floor (280 mm): 190×280 edge beams + 16 joists</text>
  <text x="670" y="196" class="mono-sm">• Ceiling (170 mm): 190×470 downstand edge beams</text>
  <text x="670" y="210" class="mono-sm">• rooms = {2}, storeys = 1..3 (open inside room)</text>
  <text x="670" y="224" class="mono-sm">• layouts: per-wall openings &amp; porch setback</text>
  <text x="670" y="238" class="small">• Examples: room_module, module_block, bank_pavilion</text>
</svg>