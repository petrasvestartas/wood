<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="265" class="bg"/>
  <text x="16" y="22" class="title">RECIPROCAL FRAMES — PRIMARY INPUTS &amp; 4-STEP PIPELINE (ReciprocalRotation &amp; ReciprocalMove)</text>

  <!-- Step 1: Primary Inputs -->
  <rect x="14" y="34" width="225" height="216" class="panel-warm"/>
  <rect x="24" y="42" width="136" height="16" class="badge-amber"/>
  <text x="92" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="166" y="53" class="mono-sm">mesh</text>
  <!-- Quad / Hex mesh on surface -->
  <polygon points="48,92 102,78 156,92 102,108" class="timber-b"/>
  <polygon points="102,78 156,66 206,82 156,92" class="timber-a"/>
  <polygon points="48,122 102,108 156,122 102,138" class="timber-a"/>
  <polygon points="102,108 156,92 206,112 156,122" class="timber-b"/>
  <text x="126" y="156" text-anchor="middle" class="mono-amber">Mesh (Quad / Hex / Dual-Hex)</text>
  <text x="26" y="172" class="mono-sm">• mesh: Mesh (dome/hypar/Annen)</text>
  <text x="26" y="186" class="mono-sm">• Rotation: angle=0.35, scale=1.4</text>
  <text x="26" y="200" class="mono-sm">• Move: shift = 100.0 (≥ width/2)</text>
  <text x="26" y="214" class="mono-sm">• width = 100, height = 400 mm</text>
  <text x="26" y="228" class="mono-sm">• cut_offset_factor = 1.0 (flush)</text>
  <text x="26" y="242" class="small">• CornerJoint::Miter or Butt</text>

  <line x1="239" y1="142" x2="255" y2="142" class="flow-arrow"/>

  <!-- Step 2: Two Axis Generation Laws -->
  <rect x="257" y="34" width="225" height="216" class="panel"/>
  <rect x="267" y="42" width="144" height="16" class="badge"/>
  <text x="339" y="53" text-anchor="middle" class="badge-text">2. AXIS TRANSFORM</text>
  <text x="418" y="53" class="mono-sm">axes</text>
  <!-- Top: Rotation pinwheel -->
  <line x1="278" y1="98" x2="352" y2="98" class="guide-line"/>
  <line x1="315" y1="66" x2="315" y2="130" class="guide-line"/>
  <line x1="276" y1="112" x2="354" y2="84" stroke="#0284c7" stroke-width="2.4"/>
  <circle cx="315" cy="98" r="3" fill="#e11d48"/>
  <text x="315" y="76" text-anchor="middle" class="mono-blue">Rotation(up, α)</text>
  <!-- Bottom: Move 2-colored bisector shift -->
  <rect x="382" y="76" width="76" height="50" fill="none" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <line x1="382" y1="86" x2="458" y2="86" stroke="#d97706" stroke-width="2.4"/>
  <line x1="382" y1="116" x2="458" y2="116" stroke="#d97706" stroke-width="2.4"/>
  <text x="420" y="72" text-anchor="middle" class="mono-amber">Move (+bisector·shift)</text>
  <text x="269" y="156" class="mono-sm">ReciprocalRotation:</text>
  <text x="269" y="170" class="mono-sm">  turn edge by angle around up,</text>
  <text x="269" y="184" class="mono-sm">  lengthen by scale about midpoint</text>
  <text x="269" y="202" class="mono-sm">ReciprocalMove:</text>
  <text x="269" y="216" class="mono-sm">  2-color half-edges via BFS; shift</text>
  <text x="269" y="230" class="mono-sm">  color-0 sideways by shift</text>
  <text x="269" y="242" class="small">Group: group_named("axes")</text>

  <line x1="482" y1="142" x2="498" y2="142" class="flow-arrow"/>

  <!-- Step 3: Boundary Frame -->
  <rect x="500" y="34" width="225" height="216" class="panel"/>
  <rect x="510" y="42" width="144" height="16" class="badge"/>
  <text x="582" y="53" text-anchor="middle" class="badge-text">3. BOUNDARY FRAME</text>
  <text x="660" y="53" class="mono-sm">frame</text>
  <!-- Perimeter frame beams with miter vs priority butt -->
  <polygon points="528,82 678,82 664,98 542,98" class="timber-b"/>
  <polygon points="528,82 542,98 542,148 528,148" class="timber-a"/>
  <polygon points="678,82 692,82 692,148 678,148" class="timber-a"/>
  <line x1="528" y1="82" x2="542" y2="98" stroke="#e11d48" stroke-width="2"/>
  <line x1="678" y1="82" x2="678" y2="98" stroke="#e11d48" stroke-width="2"/>
  <text x="546" y="75" class="mono-red">Miter</text>
  <text x="676" y="75" text-anchor="middle" class="mono-red">Butt (priority)</text>
  <text x="512" y="170" class="mono-sm">boundary_frame() &amp; frame_beams():</text>
  <text x="512" y="184" class="mono-sm">• Walk naked boundary loops</text>
  <text x="512" y="198" class="mono-sm">• Transport frame_ups across</text>
  <text x="512" y="212" class="mono-sm">  corner miter planes</text>
  <text x="512" y="226" class="mono-sm">• CornerJoint::Miter or Butt</text>
  <text x="512" y="242" class="small">Group: group_named("frame")</text>

  <line x1="725" y1="142" x2="741" y2="142" class="flow-arrow"/>

  <!-- Step 4: Boxed Beams & End-Cut Trimming -->
  <rect x="743" y="34" width="223" height="216" class="panel-hi"/>
  <rect x="753" y="42" width="144" height="16" class="badge-blue"/>
  <text x="825" y="53" text-anchor="middle" class="badge-text">4. TRIMMED BEAMS</text>
  <text x="903" y="53" class="mono-sm">beams</text>
  <!-- Pinwheel of 4 reciprocal beams stopping flush on neighbour sides -->
  <polygon points="776,84 858,84 858,100 776,100" class="timber-a"/>
  <polygon points="858,72 874,72 874,142 858,142" class="timber-b"/>
  <polygon points="794,126 858,126 858,142 794,142" class="timber-c"/>
  <polygon points="794,100 810,100 810,152 794,152" class="timber-d"/>
  <line x1="858" y1="78" x2="858" y2="106" stroke="#e11d48" stroke-width="2.4"/>
  <text x="854" y="68" text-anchor="middle" class="mono-red">Flush CutFace plane</text>
  <text x="755" y="170" class="mono-sm">cut_beam(start, end, dir, up, w, h):</text>
  <text x="755" y="184" class="mono-sm">• Extend axis by width × extend</text>
  <text x="755" y="198" class="mono-sm">• Stop each end at side plane</text>
  <text x="755" y="212" class="mono-sm">  M_j ± (w/2)·cut_offset·side_j</text>
  <text x="755" y="226" class="mono-sm">  of crossing neighbour or frame</text>
  <text x="755" y="242" class="small">Group: group_named("beams")</text>
</svg>