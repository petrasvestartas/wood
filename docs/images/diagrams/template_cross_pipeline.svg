<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%">
  
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .panel-hi { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.4; rx: 6; }
      .panel-warm { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 6; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.02em; }
      .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .small { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #64748b; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; fill: #0f172a; }
      .mono-sm { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; fill: #334155; }
      .mono-blue { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
      .mono-red { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #be123c; }
      .mono-amber { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #b45309; }
      .mono-green { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; font-weight: 600; fill: #15803d; }
      .badge { fill: #0f172a; rx: 3; }
      .badge-blue { fill: #0284c7; rx: 3; }
      .badge-amber { fill: #d97706; rx: 3; }
      .badge-text { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .timber-a { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-b { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-c { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; stroke-linejoin: round; }
      .timber-d { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; stroke-linejoin: round; }
      .cut-zone { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.4; stroke-dasharray: 3,2; }
      .contact-zone { fill: #fecdd3; fill-opacity: 0.7; stroke: #e11d48; stroke-width: 1.6; }
      .axis-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .guide-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 2,2; fill: none; }
      .flow-arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .flow-red { stroke: #e11d48; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="980" height="260" class="bg"/>
  <text x="16" y="22" class="title">CROSS CONNECTOR SHELL — PRIMARY INPUTS &amp; 8-STEP PIPELINE (wood_cross::VdaMesh)</text>

  <!-- Step 1: Primary Input Mesh -->
  <rect x="14" y="34" width="225" height="212" class="panel-warm"/>
  <rect x="24" y="42" width="136" height="16" class="badge-amber"/>
  <text x="92" y="53" text-anchor="middle" class="badge-text">1. PRIMARY INPUTS</text>
  <text x="166" y="53" class="mono-sm">mesh</text>
  <polygon points="75,86 125,74 160,104 140,144 85,144 58,112" class="timber-b"/>
  <polygon points="125,74 178,86 196,124 160,104" class="timber-a"/>
  <polygon points="160,104 196,124 175,154 140,144" class="timber-c"/>
  <text x="126" y="164" text-anchor="middle" class="mono-amber">Welded polygon Mesh (0.01)</text>
  <text x="26" y="180" class="mono-sm">• mesh: Mesh (15-face dome)</text>
  <text x="26" y="194" class="mono-sm">• face_thickness = 40.0 mm</text>
  <text x="26" y="208" class="mono-sm">• face_positions = {0.0}</text>
  <text x="26" y="222" class="mono-sm">• edge_divisions = {2}</text>
  <text x="26" y="236" class="mono-sm">• connector: 300 × 300 × 40 mm</text>

  <line x1="239" y1="140" x2="255" y2="140" class="flow-arrow"/>

  <!-- Step 2: Face, Edge & Bisector Planes -->
  <rect x="257" y="34" width="225" height="212" class="panel"/>
  <rect x="267" y="42" width="144" height="16" class="badge"/>
  <text x="339" y="53" text-anchor="middle" class="badge-text">2. MITER PLANES</text>
  <text x="418" y="53" class="mono-sm">*_planes</text>
  <!-- Two faces meeting at an interior edge with average normal -->
  <line x1="282" y1="138" x2="368" y2="108" stroke="#0284c7" stroke-width="3"/>
  <line x1="368" y1="108" x2="454" y2="138" stroke="#16a34a" stroke-width="3"/>
  <line x1="325" y1="123" x2="313" y2="88" class="flow-blue"/>
  <line x1="411" y1="123" x2="423" y2="88" class="flow-arrow"/>
  <line x1="368" y1="148" x2="368" y2="68" class="flow-red"/>
  <text x="368" y="64" text-anchor="middle" class="mono-red">y = norm(n_0 + n_1)</text>
  <text x="269" y="172" class="mono-sm">1. face_planes: centroid, normal</text>
  <text x="269" y="187" class="mono-sm">2. edge_planes: through edge,</text>
  <text x="269" y="201" class="mono-sm">   leaning on mean normal n_0+n_1</text>
  <text x="269" y="215" class="mono-sm">3. bisector_planes: corner angle</text>
  <text x="269" y="229" class="mono-sm">   halvers (guards edges &lt; 5.7°)</text>

  <line x1="482" y1="140" x2="498" y2="140" class="flow-arrow"/>

  <!-- Step 3: Mitered Plates & Connector Frames -->
  <rect x="500" y="34" width="225" height="212" class="panel"/>
  <rect x="510" y="42" width="150" height="16" class="badge"/>
  <text x="585" y="53" text-anchor="middle" class="badge-text">3. PLATES &amp; CONNECTORS</text>
  <text x="666" y="53" class="mono-sm">connectors</text>
  <!-- Two mitered plates + 2 connector plates across seam -->
  <polygon points="520,136 604,104 604,122 526,152" class="timber-a"/>
  <polygon points="604,104 688,136 682,152 604,122" class="timber-c"/>
  <rect x="586" y="84" width="36" height="54" class="timber-b" fill-opacity="0.85"/>
  <text x="604" y="76" text-anchor="middle" class="mono-amber">connector_f0_f1_k</text>
  <text x="512" y="172" class="mono-sm">1. plates: offset face_planes ±t/2</text>
  <text x="512" y="187" class="mono-sm">   clipped by edge/bisector planes</text>
  <text x="512" y="201" class="mono-sm">2. connector_frames: k/(1+div)</text>
  <text x="512" y="215" class="mono-sm">   along interior edges (29 edges)</text>
  <text x="512" y="229" class="mono-sm">3. connectors: 58 crossing plates</text>

  <line x1="725" y1="140" x2="741" y2="140" class="flow-arrow"/>

  <!-- Step 4: Cross-Slot Joinery -->
  <rect x="743" y="34" width="223" height="212" class="panel-hi"/>
  <rect x="753" y="42" width="146" height="16" class="badge-blue"/>
  <text x="826" y="53" text-anchor="middle" class="badge-text">4. CROSS-LAP SLOTS</text>
  <text x="905" y="53" class="mono-sm">cross_laps</text>
  <!-- Exploded half-lap slots in plate and connector -->
  <polygon points="764,132 848,132 848,154 814,154 814,143 800,143 800,154 764,154" class="timber-a"/>
  <polygon points="866,86 942,86 942,136 910,136 910,112 896,112 896,136 866,136" class="timber-b"/>
  <rect x="800" y="143" width="14" height="11" class="cut-zone"/>
  <rect x="896" y="112" width="14" height="24" class="cut-zone"/>
  <text x="854" y="76" text-anchor="middle" class="mono-red">JointPlate::cross_slot()</text>
  <text x="755" y="172" class="mono-sm">compute_cross_contact(conn, plate):</text>
  <text x="755" y="187" class="mono-sm">• JointPlate::cross_slot() oriented</text>
  <text x="755" y="201" class="mono-sm">  on crossing (target 0: connector,</text>
  <text x="755" y="215" class="mono-sm">  target 1: face plate)</text>
  <text x="755" y="229" class="mono-sm">• 116 slots merged into outlines</text>
</svg>