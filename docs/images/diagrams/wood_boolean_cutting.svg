<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" width="100%" style="max-width:1120px;display:block;margin:14px auto;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2196ea"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e8478b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
      .halo-panel { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 11px; font-weight: 700; fill: #0f172a; letter-spacing: 0.04em; }
      .sub { font-size: 9.5px; font-weight: 500; fill: #475569; }
      .code { font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .dim { font-size: 9px; font-weight: 600; fill: #334155; }
      .badge { font-size: 9px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="260" fill="url(#grid)"/>
  <rect x="0" y="0" width="1120" height="30" fill="#111111"/>
  <text x="14" y="19" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="0.06em">[CUTTING · BOOLEAN &amp; EXACT BREP PIPELINE]</text>
  <rect x="516.4" y="5" width="589.6" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="811.2" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="600">Stock -&gt; Plane / Profile / Solid / Joint Cutters -&gt; Cut Mesh &amp; Analytical BRep</text>
  
  <!-- 4 Columns showing the 4 InteractionFeature cutters -->
  <!-- 1: Plane -->
  <g transform="translate(14, 42)">
    <rect width="262" height="204" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="262" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="16" class="title">1 · INTERACTIONFEATUREPLANE</text>
    <polygon points="24,116 116,116 116,66 24,66" fill="#dbeafe" stroke="#2196ea" stroke-width="1.3"/>
    <polygon points="94,116 144,116 144,66 116,66" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,2"/>
    <line x1="122" y1="52" x2="88" y2="128" stroke="#dc2626" stroke-width="2.2"/>
    <line x1="105" y1="90" x2="126" y2="98" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-pink)"/>
    <text x="154" y="76" class="code" fill="#dc2626">CutPlane(n)</text>
    <text x="154" y="94" class="sub">Keeps negative</text>
    <text x="154" y="108" class="sub">half-space</text>
    <rect x="12" y="138" width="238" height="54" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="154" class="code">Plate::trim_by_plane / Beam::trim</text>
    <text x="20" y="170" class="sub">Mesh: BooleanPolyline::clip_mesh_by_plane</text>
    <text x="20" y="184" class="sub">BRep: BRep::trimmed_by_plane (exact cap)</text>
  </g>

  <!-- 2: Profile -->
  <g transform="translate(288, 42)">
    <rect width="262" height="204" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="262" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="16" class="title">2 · INTERACTIONFEATUREPROFILE</text>
    <!-- Plate with edge slot and interior hole -->
    <polygon points="22,120 132,120 132,62 96,62 96,82 76,82 76,62 22,62" fill="#dbeafe" stroke="#2196ea" stroke-width="1.3"/>
    <circle cx="48" cy="92" r="12" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
    <rect x="76" y="62" width="20" height="20" fill="none" stroke="#e8478b" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="142" y="76" class="code" fill="#be185d">Edge cross:</text>
    <text x="142" y="90" class="sub">Clipper2 2D diff</text>
    <text x="142" y="108" class="code" fill="#b45309">Interior loop:</text>
    <text x="142" y="122" class="sub">3D loft subtract</text>
    <rect x="12" y="138" width="238" height="54" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="154" class="code">Profile(plane, loops)</text>
    <text x="20" y="170" class="sub">Through-holes &amp; blind pockets (depth)</text>
    <text x="20" y="184" class="sub">BRep: BRep::cut_profile (exact extrude)</text>
  </g>

  <!-- 3: Solid -->
  <g transform="translate(562, 42)">
    <rect width="262" height="204" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="262" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="16" class="title">3 · INTERACTIONFEATURESOLID</text>
    <rect x="24" y="66" width="88" height="52" fill="#dbeafe" stroke="#2196ea" stroke-width="1.3"/>
    <rect x="78" y="54" width="48" height="36" fill="#fee2e2" fill-opacity="0.8" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,2"/>
    <text x="136" y="74" class="code" fill="#dc2626">subtract (-)</text>
    <text x="136" y="90" class="sub">carves stock</text>
    <text x="136" y="108" class="code" fill="#059669">add (+)</text>
    <text x="136" y="122" class="sub">glues head_blocks</text>
    <rect x="12" y="138" width="238" height="54" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="154" class="code">Manifold v3.5.4 Boolean Kernel</text>
    <text x="20" y="170" class="sub">MeshBoolean::compute({stock, cutter}, op)</text>
    <text x="20" y="184" class="sub">BRep: BRep::from_polylines + planar merge</text>
  </g>

  <!-- 4: Joint & Drill -->
  <g transform="translate(836, 42)">
    <rect width="270" height="204" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="270" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="16" class="title">4 · INTERACTIONFEATUREJOINT</text>
    <rect x="22" y="64" width="96" height="54" fill="#dbeafe" stroke="#2196ea" stroke-width="1.3"/>
    <circle cx="52" cy="91" r="13" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
    <circle cx="88" cy="91" r="13" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
    <text x="128" y="76" class="code" fill="#065f46">Exact BRep Bore</text>
    <text x="128" y="92" class="sub">Analytical NURBS</text>
    <text x="128" y="106" class="sub">cylinder face</text>
    <rect x="12" y="138" width="246" height="54" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="154" class="code">Joint / JointPlate / JointBeam</text>
    <text x="20" y="170" class="sub">Combines outline cuts + solid pockets +</text>
    <text x="20" y="184" class="sub">drill_lines (16-gon mesh / exact NURBS BRep)</text>
  </g>
  
</svg>
