<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 295" width="100%" style="max-width:1120px;display:block;margin:14px auto;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2196ea"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e8478b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
      .halo-panel { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 11px; font-weight: 700; fill: #0f172a; letter-spacing: 0.04em; }
      .sub { font-size: 9.5px; font-weight: 500; fill: #475569; }
      .code { font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .dim { font-size: 9px; font-weight: 600; fill: #334155; }
      .badge { font-size: 9px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="295" fill="url(#grid)"/>
  <rect x="0" y="0" width="1120" height="30" fill="#111111"/>
  <text x="14" y="19" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="0.06em">[JOINTPLATE · UNIT BOX &amp; 7 CONTACT FAMILIES]</text>
  <rect x="538" y="5" width="568" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="822" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="600">Unit Box [-0.5, 0.5]^3 -&gt; orient(contact, elements) -&gt; Outline &amp; Solid Cuts</text>
  
  <!-- Left Panel: Unit Box [-0.5, 0.5]^3 -->
  <rect x="14" y="42" width="350" height="239" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="14" y="42" width="350" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="24" y="58" class="title">1 · UNIT BOX [-0.5, +0.5]³ &amp; ORIENTATION MAP</text>

  <!-- Isometric Unit Cube -->
  <g transform="translate(36, 78)">
    <!-- Back edges -->
    <polygon points="40,36 140,16 190,46 90,66" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <polygon points="40,116 140,96 190,126 90,146" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="36" x2="40" y2="116" stroke="#94a3b8" stroke-width="1"/>
    <line x1="140" y1="16" x2="140" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="190" y1="46" x2="190" y2="126" stroke="#94a3b8" stroke-width="1"/>
    <line x1="90" y1="66" x2="90" y2="146" stroke="#64748b" stroke-width="1.2"/>

    <!-- Male pink polyline pair -->
    <polyline points="48,96 68,60 92,64 82,102 114,96 130,58 154,62 144,100" fill="none" stroke="#e8478b" stroke-width="2.4"/>
    <!-- Female blue polyline pair -->
    <polyline points="48,66 68,100 92,104 82,66 114,60 130,98 154,102 144,64" fill="none" stroke="#2196ea" stroke-width="2"/>

    <!-- Local coordinate triad -->
    <line x1="40" y1="116" x2="108" y2="102" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-pink)"/>
    <text x="114" y="104" class="code" fill="#dc2626">X (seam)</text>
    <line x1="40" y1="116" x2="78" y2="139" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="82" y="146" class="code" fill="#059669">Y (depth)</text>
    <line x1="40" y1="116" x2="40" y2="54" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="14" y="52" class="code" fill="#2563eb">Z (thick)</text>

    <!-- Parameter callouts -->
    <text x="200" y="34" class="code" fill="#be185d">■ male m[2k], m[2k+1]</text>
    <text x="200" y="52" class="code" fill="#1d4ed8">■ female f[2k], f[2k+1]</text>
    <text x="200" y="76" class="sub">divisions: teeth along X</text>
    <text x="200" y="92" class="sub">shift ∈ [0,1]: dovetail lean</text>
    <text x="200" y="108" class="sub">division_length: auto when 0</text>
    <text x="200" y="128" class="code" fill="#0f172a">orient(contact, {a, b})</text>
    <text x="200" y="142" class="sub">maps [-0.5,0.5]³ → contact</text>
  </g>

  <rect x="26" y="236" width="326" height="34" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="251" class="code">CutType per outline pair:</text>
  <text x="36" y="264" class="sub">side_Swap / edge_insertion (merge outline) · mill / slice / hole (3D solid)</text>

  <!-- Right Panel: 7 JointPlate Families -->
  <rect x="376" y="42" width="730" height="239" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="376" y="42" width="730" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="386" y="58" class="title">2 · SEVEN JOINTPLATE FAMILIES (CONTACT GEOMETRY &amp; PRESETS)</text>

  <!-- 7 mini cards (4 top, 3 bottom) -->
  <!-- 11: side_side_outplane -->
  <g transform="translate(388, 76)">
    <rect width="170" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">11 · side_side_outplane</text>
    <polygon points="18,68 58,68 58,48 18,48" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <polygon points="58,68 78,34 62,26 46,48" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <text x="86" y="36" class="sub">Folded miter</text>
    <text x="86" y="50" class="sub">fingers, tenons</text>
    <text x="86" y="64" class="sub">linked_tenons</text>
    <text x="8" y="86" class="dim" fill="#475569">div_len=450 · shift=0.64</text>
  </g>

  <!-- 12: side_side_inplane -->
  <g transform="translate(566, 76)">
    <rect width="170" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">12 · side_side_inplane</text>
    <rect x="14" y="42" width="32" height="20" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="46" y="42" width="32" height="20" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <polygon points="38,46 54,56 54,46 38,56" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="84" y="36" class="sub">Coplanar seam</text>
    <text x="84" y="50" class="sub">dovetails, keys</text>
    <text x="84" y="64" class="sub">hilti connector</text>
    <text x="8" y="86" class="dim" fill="#475569">div_len=300 · shift=0.50</text>
  </g>

  <!-- 13: side_side_rotated -->
  <g transform="translate(744, 76)">
    <rect width="170" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">13 · side_side_rotated</text>
    <polygon points="14,58 44,58 44,38 14,38" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <polygon points="44,54 74,64 78,44 44,38" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <text x="84" y="36" class="sub">Twisted seam</text>
    <text x="84" y="50" class="sub">miter, hooks</text>
    <text x="84" y="64" class="sub">keys, removal</text>
    <text x="8" y="86" class="dim" fill="#475569">div_len=300 · shift=0.50</text>
  </g>

  <!-- 20: top_side -->
  <g transform="translate(922, 76)">
    <rect width="172" height="94" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#be185d">20 · top_side</text>
    <rect x="14" y="56" width="64" height="14" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="38" y="26" width="16" height="36" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <text x="84" y="36" class="sub">T-joint edge/face</text>
    <text x="84" y="50" class="sub">tenons, snap_fit</text>
    <text x="84" y="64" class="sub">dovetails</text>
    <text x="8" y="86" class="dim" fill="#475569">div_len=400 · shift=0.50</text>
  </g>

  <!-- Row 2 of Families -->
  <!-- 30: cross -->
  <g transform="translate(388, 178)">
    <rect width="228" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">30 · cross (ContactCross)</text>
    <rect x="16" y="44" width="64" height="16" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="40" y="26" width="16" height="52" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <text x="90" y="36" class="sub">Plates crossing in 3D</text>
    <text x="90" y="52" class="sub">cross_slot (plates)</text>
    <text x="90" y="66" class="sub">half_lap / brussels (beams)</text>
    <text x="8" y="84" class="dim" fill="#475569">compute_cross_contact(a, b)</text>
  </g>

  <!-- 40: top_top -->
  <g transform="translate(626, 178)">
    <rect width="248" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#1d4ed8">40 · top_top (Stacked Pin Layouts)</text>
    <rect x="16" y="30" width="54" height="42" rx="2" fill="#eff6ff" stroke="#2196ea" stroke-width="1.2"/>
    <circle cx="30" cy="42" r="2.5" fill="#be185d"/>
    <circle cx="43" cy="42" r="2.5" fill="#be185d"/>
    <circle cx="56" cy="42" r="2.5" fill="#be185d"/>
    <circle cx="30" cy="60" r="2.5" fill="#be185d"/>
    <circle cx="43" cy="60" r="2.5" fill="#be185d"/>
    <circle cx="56" cy="60" r="2.5" fill="#be185d"/>
    <text x="80" y="36" class="sub">centre_pin · polylabel_pin</text>
    <text x="80" y="52" class="sub">circle_pins · ring_pins</text>
    <text x="80" y="66" class="sub">grid_pins · rectangle_pins</text>
    <text x="8" y="84" class="dim" fill="#475569">Clearance: ≥ 2·radius from contact edge</text>
  </g>

  <!-- border: single-plate edge -->
  <g transform="translate(884, 178)">
    <rect width="210" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="8" y="15" class="code" fill="#059669">border (Single-Plate Edge)</text>
    <polygon points="16,66 16,36 28,36 28,48 40,48 40,36 52,36 52,48 64,48 64,66" fill="#dcfce7" stroke="#059669" stroke-width="1.2"/>
    <text x="76" y="38" class="sub">border_fingers(divs)</text>
    <text x="76" y="54" class="sub">orient(plate, side)</text>
    <text x="8" y="84" class="dim" fill="#475569">1 target: tabs along free edge</text>
  </g>
  
</svg>
