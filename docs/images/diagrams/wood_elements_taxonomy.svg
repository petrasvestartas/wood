<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" width="100%" style="max-width:1120px;display:block;margin:14px auto;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2196ea"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e8478b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <style>
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
      .halo-panel { paint-order: stroke; stroke: #f8fafc; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 11px; font-weight: 700; fill: #0f172a; letter-spacing: 0.04em; }
      .sub { font-size: 9.5px; font-weight: 500; fill: #475569; }
      .code { font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .dim { font-size: 9px; font-weight: 600; fill: #334155; }
      .badge { font-size: 9px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="290" fill="url(#grid)"/>
  <rect x="0" y="0" width="1120" height="30" fill="#111111"/>
  <text x="14" y="19" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="0.06em">[ELEMENTS · TIMBER &amp; AUXILIARY TAXONOMY]</text>
  <rect x="610" y="5" width="496" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="858" y="18" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="600">10 Element Subclasses: Timber Solids, Cutters &amp; Parametric Joints</text>
  
  <!-- 5 Columns x 2 Rows of Element Cards -->
  <!-- Card 1: Plate -->
  <g transform="translate(14, 42)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="10" y="15" class="title" fill="#1d4ed8">Plate(bottom, top)</text>
    <polygon points="24,78 96,88 128,68 56,58" fill="#dbeafe" fill-opacity="0.7" stroke="#2196ea" stroke-width="1.3"/>
    <polygon points="24,58 96,68 128,48 56,38" fill="#eff6ff" fill-opacity="0.85" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="24" y1="58" x2="24" y2="78" stroke="#2196ea" stroke-width="1.2"/>
    <line x1="96" y1="68" x2="96" y2="88" stroke="#2196ea" stroke-width="1.2"/>
    <line x1="128" y1="48" x2="128" y2="68" stroke="#2196ea" stroke-width="1.2"/>
    <text x="136" y="48" class="dim" fill="#1d4ed8">top (f1)</text>
    <text x="136" y="68" class="dim" fill="#64748b">side j+2</text>
    <text x="136" y="86" class="dim" fill="#2196ea">bot (f0)</text>
    <text x="10" y="104" class="sub">2 planar loops · outline merge</text>
  </g>

  <!-- Card 2: PlateCurved -->
  <g transform="translate(234, 42)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="10" y="15" class="title" fill="#1d4ed8">PlateCurved(oa, ob, ia, ib)</text>
    <path d="M 22,78 Q 68,30 122,64" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
    <path d="M 38,90 Q 84,42 138,76" fill="none" stroke="#2196ea" stroke-width="1.8"/>
    <line x1="22" y1="78" x2="38" y2="90" stroke="#64748b" stroke-width="1.1"/>
    <line x1="54" y1="56" x2="70" y2="68" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="88" y1="52" x2="104" y2="64" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="122" y1="64" x2="138" y2="76" stroke="#64748b" stroke-width="1.1"/>
    <text x="144" y="60" class="dim" fill="#1d4ed8">4 NURBS</text>
    <text x="144" y="76" class="dim" fill="#475569">rulings</text>
    <text x="10" y="104" class="sub">6-face exact NURBS BRep · flat</text>
  </g>

  <!-- Card 3: Beam -->
  <g transform="translate(454, 42)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#fef3c7" stroke="#fde68a"/>
    <text x="10" y="15" class="title" fill="#b45309">Beam(axis, profile, z)</text>
    <polygon points="22,64 42,50 42,80 22,90" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
    <polygon points="22,64 122,42 142,28 42,50" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <polygon points="42,50 142,28 142,58 42,80" fill="#fef9c3" stroke="#d97706" stroke-width="1.2"/>
    <line x1="32" y1="70" x2="132" y2="45" stroke="#e8478b" stroke-width="1.8" marker-end="url(#arr-pink)"/>
    <text x="148" y="46" class="dim" fill="#be185d">axis</text>
    <text x="148" y="66" class="dim" fill="#b45309">profile</text>
    <text x="10" y="104" class="sub">Prismatic sweep · miter frame</text>
  </g>

  <!-- Card 4: BeamVariable -->
  <g transform="translate(674, 42)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#fef3c7" stroke="#fde68a"/>
    <text x="10" y="15" class="title" fill="#b45309">BeamVariable(axis, profs)</text>
    <path d="M 22,44 L 138,44 L 138,76 Q 80,52 22,86 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <line x1="58" y1="44" x2="58" y2="71" stroke="#d97706" stroke-dasharray="2,2"/>
    <line x1="98" y1="44" x2="98" y2="66" stroke="#d97706" stroke-dasharray="2,2"/>
    <text x="144" y="54" class="dim" fill="#b45309">stations</text>
    <text x="144" y="72" class="dim" fill="#64748b">soffit</text>
    <text x="10" y="104" class="sub">Multi-section loft · parabolic rib</text>
  </g>

  <!-- Card 5: Column + Support -->
  <g transform="translate(894, 42)">
    <rect width="212" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="212" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="10" y="15" class="title" fill="#065f46">Column &amp; Support</text>
    <!-- Base & head plate -->
    <rect x="42" y="82" width="48" height="6" fill="#94a3b8" stroke="#475569"/>
    <rect x="52" y="74" width="28" height="8" fill="#cbd5e1" stroke="#475569"/>
    <!-- Shaft + head blocks -->
    <rect x="54" y="34" width="24" height="40" fill="#dcfce7" stroke="#059669" stroke-width="1.4"/>
    <rect x="44" y="34" width="10" height="18" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <rect x="78" y="34" width="10" height="18" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="98" y="46" class="dim" fill="#ca8a04">head_blocks</text>
    <text x="98" y="64" class="dim" fill="#065f46">shaft</text>
    <text x="98" y="84" class="dim" fill="#475569">Support + 3 pins</text>
    <text x="10" y="104" class="sub">Glued head + steel base seat</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 6: Block & Pin -->
  <g transform="translate(14, 164)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="15" class="title">Block(mesh) &amp; Pin(h,d,r,L)</text>
    <!-- Wedge block -->
    <polygon points="24,42 74,42 58,82 24,82" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
    <!-- Cylinder pin -->
    <line x1="96" y1="62" x2="156" y2="62" stroke="#e8478b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="96" cy="62" r="4" fill="#be185d"/>
    <text x="92" y="50" class="dim" fill="#be185d">head</text>
    <text x="130" y="50" class="dim" fill="#475569">Ø2r × L</text>
    <text x="10" y="104" class="sub">Connector child solids &amp; dowels</text>
  </g>

  <!-- Card 7: CutPlane & Profile -->
  <g transform="translate(234, 164)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="10" y="15" class="title">CutPlane &amp; Profile</text>
    <!-- CutPlane tilted -->
    <polygon points="22,78 58,36 86,44 50,86" fill="#fee2e2" fill-opacity="0.7" stroke="#dc2626" stroke-width="1.3"/>
    <line x1="54" y1="61" x2="72" y2="48" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-pink)"/>
    <!-- Profile 2D loop -->
    <rect x="106" y="42" width="44" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <circle cx="128" cy="62" r="10" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
    <text x="158" y="58" class="dim" fill="#dc2626">Plane</text>
    <text x="158" y="76" class="dim" fill="#b45309">2D loops</text>
    <text x="10" y="104" class="sub">Half-space trim &amp; 2D pocket/hole</text>
  </g>

  <!-- Card 8: Joint (Drill & Support) -->
  <g transform="translate(454, 164)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="10" y="15" class="title" fill="#be185d">Joint::drill(lines, r, n)</text>
    <rect x="28" y="42" width="90" height="42" fill="#eff6ff" stroke="#2196ea" stroke-width="1.2"/>
    <line x1="52" y1="32" x2="52" y2="92" stroke="#e8478b" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="92" y1="32" x2="92" y2="92" stroke="#e8478b" stroke-width="2" stroke-dasharray="3,2"/>
    <ellipse cx="52" cy="42" rx="7" ry="3" fill="#fce7f3" stroke="#be185d" stroke-width="1.3"/>
    <ellipse cx="92" cy="42" rx="7" ry="3" fill="#fce7f3" stroke="#be185d" stroke-width="1.3"/>
    <text x="128" y="58" class="dim" fill="#be185d">drill_lines</text>
    <text x="128" y="74" class="dim" fill="#059669">exact NURBS</text>
    <text x="10" y="104" class="sub">Multi-axis cylindrical bore</text>
  </g>

  <!-- Card 9: JointPlate -->
  <g transform="translate(674, 164)">
    <rect width="210" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="210" height="22" rx="4" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="10" y="15" class="title" fill="#be185d">JointPlate (38 Presets)</text>
    <polyline points="24,76 24,52 46,52 46,76 68,76 68,52 90,52 90,76" fill="none" stroke="#e8478b" stroke-width="2"/>
    <polyline points="24,46 24,70 46,70 46,46 68,46 68,70 90,70 90,46" fill="none" stroke="#2196ea" stroke-width="1.6"/>
    <text x="104" y="54" class="dim" fill="#be185d">7 families</text>
    <text x="104" y="70" class="dim" fill="#1d4ed8">unit box [-½,½]³</text>
    <text x="10" y="104" class="sub">Fingers, tenons, slots, keys, pins</text>
  </g>

  <!-- Card 10: JointBeam -->
  <g transform="translate(894, 164)">
    <rect width="212" height="112" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="212" height="22" rx="4" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="10" y="15" class="title" fill="#be185d">JointBeam (Butt &amp; Connectors)</text>
    <!-- Half-lap crossing beams -->
    <rect x="24" y="54" width="76" height="20" fill="#dbeafe" stroke="#2196ea" stroke-width="1.2"/>
    <rect x="50" y="36" width="24" height="52" fill="#fce7f3" stroke="#e8478b" stroke-width="1.2"/>
    <rect x="50" y="54" width="24" height="10" fill="#fbcfe8" stroke="#be185d" stroke-width="1.4"/>
    <text x="110" y="54" class="dim" fill="#be185d">from_contact</text>
    <text x="110" y="70" class="dim" fill="#1d4ed8">butt / wedge / pins</text>
    <text x="10" y="104" class="sub">Axis joinery &amp; face connectors</text>
  </g>
  
</svg>
