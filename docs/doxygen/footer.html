<!-- no bottom bar: navtree.js still reads #nav-path's height, so it stays, empty -->
<div id="nav-path" class="navpath"></div>
<!--END GENERATE_TREEVIEW-->
<!--BEGIN !GENERATE_TREEVIEW-->
</div><!-- doc-content -->
<!--END !GENERATE_TREEVIEW-->
<script type="text/javascript" src="$relpath^app.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  // Outfit at 18 px, wood.css colours them so they follow the scheme toggle; the diagrams drawn top to bottom in the pages, so they keep their text readable at page width
  mermaid.initialize({ startOnLoad: false, theme: "neutral", themeVariables: { fontFamily: "Outfit, sans-serif", fontSize: "18px" }, flowchart: { useMaxWidth: true }, class: { useMaxWidth: true } });
  // measured in the font they are drawn in, or labels are clipped
  await document.fonts.load("18px Outfit");
  mermaid.run({ querySelector: ".mermaid" });
</script>
</body>
</html>
